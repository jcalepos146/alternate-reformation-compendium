_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gnesio-lutherans", "t": "faction", "name": "Gnesio-Lutherans", "st": "canon", "when": "1548–75", "y": 1548, "y2": null, "sum": "The hard party of Flacius and Amsdorf that refuses both Interims.", "body": ["Strongest in Ernestine Thuringia, Magdeburg, Mansfeld, and the Hanseatic north in 1550. The party becomes the Gnesio-Catholic church at the Bohemian union of 1575 ([[bohemian-union-1575]]).", "The failed [[princes-revolt]] gives the party a new opportunity. Its dissidents interpret Maurice’s death as divine judgment, and his successor [[augustus-of-saxony]] accepts their cause. Their opposition to Lambeth can therefore coexist with participation by other evangelicals in a pan-Protestant political movement."], "facts": [], "faith": ["gnesio-catholic"], "office": null, "rel": [["philippists", "The opposing party."]], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "spirituali", "t": "faction", "name": "The Spirituali", "st": "canon", "when": "1535–1789", "y": 1541, "y2": null, "sum": "A circle of reforming cardinals seeking a settlement with the evangelicals.", "body": ["Contarini, Pole and Morone hold the line that justification can be taught in terms both Rome and Wittenberg can accept. In this timeline their argument wins at Trent in 1547 and the Roman communion becomes more Augustinian."], "facts": [], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "baianists", "t": "faction", "name": "Baianists", "st": "canon", "when": "1567–1789", "y": 1567, "y2": null, "sum": "The Augustinian school of Louvain and Ghent.", "body": ["Followers of Baius teach that fallen human nature cannot do good without grace. Rome censures them only lightly and Spanish authorities tolerate them. Friction with Lyon’s catechism on concupiscence is an open question. Jansen is a proposed successor."], "facts": [], "faith": ["roman-catholic", "gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["How Baius’s teaching on concupiscence squares with Lyon’s catechism."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "guise-party", "t": "faction", "name": "The Guise Party and the Holy League", "st": "hist", "when": "1560–1598", "y": 1576, "y2": null, "sum": "The ultra-Catholic faction of the Guise family and the League.", "body": ["The Guises hold Reims and press their own primatial claims. The Catholic League problem and the succession in 1589, when the Protestant Henry of Navarre was heir, survive in this timeline even with shorter wars and a partly successful Poissy."], "facts": [], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "parlement-paris", "t": "faction", "name": "The Parlement of Paris", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The court that guards Gallican liberties against churchmen.", "body": ["The Parlement is a resistance point to Lyon’s primacy. It refuses any churchman a claim over the Crown’s church. Its alliance with the king is what makes the Gallican settlement work."], "facts": [], "faith": ["gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "huguenot-hardliners", "t": "faction", "name": "Hardline Huguenots", "st": "canon", "when": "to 1628", "y": 1561, "y2": null, "sum": "Huguenots of Béarn, Languedoc and La Rochelle.", "body": ["Strict Calvinists who refuse the Cranmerian settlement. Broken at [[la-rochelle]] in 1628, they shrink to the Cévennes and Béarn’s mountains."], "facts": [], "faith": ["hardline-reformed"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "huguenot-moderates", "t": "faction", "name": "Cranmerian Huguenots", "st": "canon", "when": "1561–1789", "y": 1561, "y2": null, "sum": "Moderate Huguenots of Normandy, Poitou and Dauphiné who join the Cranmerian communion.", "body": ["Protected by Henry IV’s edict and not revoked. In 1685 they are still protected."], "facts": [], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "reconciled-huguenots", "t": "faction", "name": "Reconciled Huguenots", "st": "canon", "when": "1561–1789", "y": 1561, "y2": null, "sum": "Nobles and townspeople around Paris, Orléans and Lyon who return to the Gallican church.", "body": ["A substantial group, mostly elites, reconciles with Lyon. More individuals reconcile than in history."], "facts": [], "faith": ["gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "catholic-league", "t": "faction", "name": "The Catholic League", "st": "canon", "when": "1609–1635", "y": 1609, "y2": null, "sum": "The Bavarian-led bloc of Roman Catholic princes in the Empire.", "body": ["One of the armed blocs on the eve of 1618. Under Maximilian of Bavaria, it fights the Bohemian revolt and the Palatinate."], "facts": [], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "evangelical-union", "t": "faction", "name": "The Cranmerian Union", "st": "canon", "when": "1608–1635", "y": 1608, "y2": null, "sum": "The Palatinate-led bloc of Cranmerian princes.", "body": ["Another armed bloc on the eve of the war. It backs Frederick V and collapses when Saxony and Brandenburg make peace at Prague in 1635 ([[peace-of-prague]])."], "facts": [], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "bohemian-estates", "t": "faction", "name": "The Bohemian Estates", "st": "canon", "when": "1609–1620", "y": 1609, "y2": null, "sum": "The nobles and towns who defy the Habsburgs in 1618.", "body": ["Gnesio-Catholic in confession, with the Brethren as allies. They depose Ferdinand and elect Frederick V in 1619 ([[defenestration-1618]]). After [[white-mountain]] the moderates make terms with Rome and the hardliners flee."], "facts": [], "faith": ["gnesio-catholic", "unity-brethren"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "royalists", "t": "faction", "name": "The Royalists (the establishment)", "st": "canon", "when": "1640s–1660s", "y": 1640, "y2": null, "sum": "The Church of England’s bishops, the nobility and the Navy, who fight in the king’s name against his ministers and then back a rival Stuart.", "body": ["The Royalists lean toward the old constitution and the episcopal establishment. The war comes in two stages: first they fight for the king against his reforming ministers, then, once the king openly sides with the Commons, they back a rival Stuart. Canon records a Royalist restoration by 1660 and a conservative, French-aligned monarchy afterward."], "facts": [], "faith": ["cranmerian"], "office": null, "rel": [["byzantinists", "A smaller, more radical party on the same side."], ["reforming-crown", "The opposing party."]], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "reforming-crown", "t": "faction", "name": "The Reforming Crown", "st": "canon", "when": "1620s–1640s", "y": 1635, "y2": null, "sum": "The king and his ministers, backed by Commons.", "body": ["The crown favours a low-church, more democratic Church of England and economic liberalisation. It is the revolutionary party in this timeline: the roles of 1642 are reversed."], "facts": [], "faith": ["cranmerian"], "office": null, "rel": [["royalists", "The opposing party."]], "color": null, "basis": null, "open_q": ["How the crown fares in the war; canon records a Royalist restoration."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "polish-toleration-party", "t": "faction", "name": "The Polish Toleration Party", "st": "canon", "when": "1573–1789", "y": 1573, "y2": null, "sum": "The nobles who defend the Warsaw Confederation against Jesuit pressure.", "body": ["The twist in this timeline is legal recognition of Gnesio-Catholic congregations. Toleration survives the Deluge and Kaunas emerges stronger. The main threat is Sigismund III and the Jesuits."], "facts": [], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "filaret-party", "t": "faction", "name": "The Anti-Latin Party in Moscow", "st": "canon", "when": "1612–1685", "y": 1620, "y2": null, "sum": "Filaret’s circle and the clergy who adopt Gnesio formulas against Rome.", "body": ["After the Polish occupation, anti-Latin feeling makes Lutheran categories an acceptable weapon. The party drives [[filaret-catechism]] and is split afterward over how far dual imputation may go."], "facts": [], "faith": ["russian-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "kiev-resisters", "t": "faction", "name": "The Kievan Resisters", "st": "canon", "when": "1627–1700", "y": 1627, "y2": null, "sum": "Kiev-trained clergy and monastic circles who resist the catechism.", "body": ["Under [[peter-mohyla]] they stand for the Greek formulas and Constantinople. After Pereiaslav ([[pereiaslav]]) Moscow absorbs its main critics, and they become an opposition inside the Russian church that later breaks away. They are the timeline’s equivalent of the Old Believers."], "facts": [], "faith": ["eastern-orthodox", "russian-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "cossacks", "t": "faction", "name": "The Zaporozhian Cossacks", "st": "canon", "when": "1648–1700", "y": 1648, "y2": null, "sum": "The host whose rising of 1648 leads to union with Moscow in 1654.", "body": ["The rising of Khmelnytsky happens as in history. Pereiaslav still follows, and Kiev’s resisters are folded into Moscow’s world."], "facts": [], "faith": ["eastern-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "west-country-reactionaries", "t": "faction", "name": "The West Country Reactionaries", "st": "canon", "when": "1630s–1650s", "y": 1630, "y2": null, "sum": "The English party that wants autocracy on Roman and Byzantine models.", "body": ["Strongest in Devon, Cornwall, Bristol and Exeter. They want an autocratic monarchy, a modernised army and a church closer to the Greeks. See [[byzantinists]]."], "facts": [], "faith": ["byzantinists"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "marignano", "t": "battle", "name": "Battle of Marignano", "st": "canon", "when": "13–14 September 1515", "y": 1515, "y2": null, "sum": "The French victory over the Swiss in which Zwingli, serving as chaplain, dies. This is the timeline’s point of divergence.", "body": ["On 13–14 September 1515 Francis I and his Venetian allies defeat the Swiss near Milan during the War of the League of Cambrai. Huldrych Zwingli accompanies the Glarus contingent as chaplain. Historically he survived; in this timeline he is killed. His death is the point of divergence, before his ministry at Einsiedeln or his appointment in Zurich.", "The Swiss defeat still damages the prestige of mercenary warfare, but there is no returning Zwingli to turn his experience into a reforming ministry. Zurich remains Roman in 1525. Luther’s challenge in Wittenberg develops independently; Swiss reform later proceeds through [[leo-jud]], [[bullinger]] and the exchanges with Basel and Strasbourg.", "The historical Zurich circle of Zwingli’s students does not form in the same way. This removes that particular origin of Swiss Anabaptism, rather than every independent radical movement. The historical Kappel Wars do not occur; the later [[zurich-settlement]] establishes a different accommodation between the cantons."], "facts": [["Date", "13–14 September 1515"], ["Place", "Near Milan"], ["Sides", "France and Venice against the Swiss Confederacy"], ["Result", "French victory; Zwingli killed"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "pavia", "t": "battle", "name": "Battle of Pavia", "st": "hist", "when": "24 February 1525", "y": 1525, "y2": null, "sum": "Imperial victory that captures Francis I.", "body": ["Charles V’s forces take the king of France prisoner. The map for 1525 is otherwise historical apart from Switzerland."], "facts": [["Date", "24 February 1525"], ["Place", "Pavia, Lombardy"], ["Sides", "Empire and Spain against France"], ["Result", "Imperial victory"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "schmalkaldic-war", "t": "battle", "name": "Schmalkaldic War", "st": "canon", "when": "1546–49", "y": 1546, "y2": 1549, "sum": "A prolonged war ending in a negotiated imperial victory and dissolution of the League.", "body": ["The Danube campaign of 1546 exposes the League’s poor coordination. Charles V wins at [[muhlberg]] in April 1547, captures John Frederick and transfers the Saxon electorate to [[maurice-of-saxony]] through the [[capitulation-of-wittenberg]]. This defeats the principal Saxon army but does not end resistance throughout Germany.", "Surviving contingents, fortified towns and disputes over the enforcement of the [[augsburg-interim]] prolong the conflict through 1548. Imperial troops can win battles more readily than they can finance permanent occupation. The remaining resistance cannot restore the League’s strategic position, but it can make unconditional submission costly.", "A negotiated settlement in 1549 dissolves the League and accepts the Emperor’s political victory. Surviving princely houses retain their dynasties under restrictions on armed association; the religious settlement remains disputed. The victory is decisive in constitutional and military terms without requiring the destruction of every evangelical army or town.", "This insecure peace drives the churches toward [[lambeth-council]]. England offers a meeting place beyond imperial jurisdiction. Trent’s softened Session 6 of January 1547 ([[council-of-trent]]) precedes Mühlberg: it belongs to the search for religious accommodation during the war and cannot be an effect of a victory not yet won."], "facts": [["Date", "1546–49"], ["Place", "South Germany and Saxony"], ["Sides", "Emperor Charles V and Maurice of Saxony against the Schmalkaldic League"], ["Result", "Negotiated imperial victory; League dissolved in 1549"]], "faith": ["cranmerian", "gnesio-catholic", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "muhlberg", "t": "battle", "name": "Battle of Mühlberg", "st": "canon", "when": "24 April 1547", "y": 1547, "y2": null, "sum": "Imperial victory that destroys the principal Saxon army, but does not end the wider war.", "body": ["On 24 April 1547 the imperial army crosses the Elbe, defeats the Saxon field army and captures John Frederick. The [[capitulation-of-wittenberg]] follows in May, transferring the electorate to Maurice.", "The defeat breaks the League’s strongest Saxon position. Other contingents and fortified towns continue resistance, extending the [[schmalkaldic-war]] until a negotiated imperial victory in 1549."], "facts": [["Date", "24 April 1547"], ["Place", "Saxony, on the Elbe"], ["Sides", "Empire against the Schmalkaldic League"], ["Result", "Overwhelming imperial victory; John Frederick captured"]], "faith": ["gnesio-catholic", "cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "siege-magdeburg", "t": "battle", "name": "Siege of Magdeburg", "st": "canon", "when": "September 1550 – November 1551", "y": 1550, "y2": null, "sum": "The city refuses the Interim and is besieged, while Flacius’s presses print the case against it.", "body": ["Magdeburg is the Gnesio refusal made into a siege. Maurice of Saxony, now elector, brings the imperial ban down on it. The city stays a Gnesio enclave."], "facts": [["Date", "September 1550 – November 1551"], ["Place", "Magdeburg"], ["Sides", "Magdeburg against Maurice of Saxony"], ["Result", "Negotiated end; city keeps its confession"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "grumbach-feud", "t": "battle", "name": "Grumbach Feud", "st": "canon", "when": "1563–67", "y": 1567, "y2": null, "sum": "The crisis that breaks the Ernestine line and splits Thuringia.", "body": ["Wilhelm von Grumbach’s feud draws Duke John Frederick II of Saxe-Gotha into rebellion, and imperial execution follows. After it Weimar and Jena stay Gnesio-Catholic while Gotha and Coburg become Philippist. The timeline must also avert Elector August’s later purge of Jena."], "facts": [["Date", "1563–67"], ["Place", "Thuringia"], ["Sides", "Ernestine rebels against the Emperor and Elector August"], ["Result", "Ernestines defeated; Thuringia split"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["How the 1573 purge of Jena is averted."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lepanto", "t": "battle", "name": "Battle of Lepanto", "st": "hist", "when": "7 October 1571", "y": 1571, "y2": null, "sum": "Holy League naval victory over the Ottomans.", "body": ["The Holy League defeats the Ottoman fleet in the Gulf of Patras. The map treats the Mediterranean as historical outside the Bohemian and Hungarian frontier."], "facts": [["Date", "7 October 1571"], ["Place", "Gulf of Patras"], ["Sides", "Holy League against the Ottoman Empire"], ["Result", "League victory"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "dutch-revolt", "t": "battle", "name": "The Revolt of the Netherlands", "st": "canon", "when": "1568–1648", "y": 1568, "y2": null, "sum": "The long war that splits the Low Countries three ways.", "body": ["North: a Cranmerian republic of the United Provinces. South: Spanish Brabant, Flanders and Luxembourg, with Baianist Louvain and Ghent tolerated. Artois, Hainaut, Tournai and Cambrai are a French protectorate. The Dutch–Spanish war resumes in 1621."], "facts": [["Date", "1568–1648"], ["Place", "Low Countries"], ["Sides", "United Provinces against Spain"], ["Result", "Three-way division by 1600"]], "faith": ["cranmerian", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "livonian-war", "t": "battle", "name": "Livonian War", "st": "canon", "when": "1558–83", "y": 1558, "y2": null, "sum": "The war that deports Dorpat’s inhabitants into Russia and fixes the Baltic border.", "body": ["The deportees of Dorpat later become the core of the Western-Rite church. At the 1583 peace Russia keeps Narva and Ivangorod but loses Dorpat. Sweden takes Estonia around Reval, which makes Swedish Estonia the Gnesio-Catholic route east."], "facts": [["Date", "1558–83"], ["Place", "Livonia"], ["Sides", "Russia against Poland-Lithuania and Sweden"], ["Result", "Russia keeps Narva; loses Dorpat"]], "faith": ["western-rite-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "long-turkish-war", "t": "battle", "name": "Long Turkish War", "st": "hist", "when": "1593–1606", "y": 1593, "y2": null, "sum": "Habsburg–Ottoman war in Hungary ending at Zsitvatorok.", "body": ["The war ends in the peace of Zsitvatorok (1606), which the frontier in this timeline keeps. It occupies Rudolf II as Bohemia’s confessional dispute festers."], "facts": [["Date", "1593–1606"], ["Place", "Hungary"], ["Sides", "Habsburgs against the Ottomans"], ["Result", "Inconclusive; Zsitvatorok"]], "faith": ["roman-catholic", "sunni"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "polish-occupation-moscow", "t": "battle", "name": "Polish Occupation of Moscow", "st": "hist", "when": "1610–12", "y": 1610, "y2": null, "sum": "The occupation that drives the anti-Latin turn in Russian theology.", "body": ["The Polish garrison holds the Kremlin until a Russian army expels it in 1612. The humiliation is the motive for Filaret’s catechism, which uses Lutheran categories as an anti-Latin weapon. The Western-Rite church stays loyal to Moscow in 1612."], "facts": [["Date", "1610–12"], ["Place", "Moscow"], ["Sides", "Poland-Lithuania against Russian forces"], ["Result", "Poles expelled"]], "faith": ["russian-orthodox", "western-rite-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "defenestration-1618", "t": "battle", "name": "Defenestration of Prague", "st": "hist", "when": "23 May 1618", "y": 1618, "y2": null, "sum": "The moment the estates cast Habsburg officials from Hradčany Castle.", "body": ["The deposition of Ferdinand follows, and the estates elect Frederick V in 1619. The war that follows is three-sided: Rome, the Cranmerian communion and the Gnesio-Catholics."], "facts": [["Date", "23 May 1618"], ["Place", "Prague"], ["Sides", "Bohemian estates against the Habsburg regents"], ["Result", "Revolt begins"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "white-mountain", "t": "battle", "name": "Battle of White Mountain", "st": "canon", "when": "8 November 1620", "y": 1620, "y2": null, "sum": "The Habsburg–League victory that returns Bohemia to Rome.", "body": ["Frederick V’s army is routed outside Prague. The Habsburgs win, Bohemia is returned to Rome by 1635, and Gnesio-Catholic exiles flood Saxe-Weimar, Poland, Sweden and Russia’s Western-Rite church. The moderates make terms: communion in both kinds and a vernacular Mass in return for full union with Rome. Budovec is executed in 1621."], "facts": [["Date", "8 November 1620"], ["Place", "Near Prague"], ["Sides", "Habsburgs and Catholic League against the Bohemian estates"], ["Result", "Habsburg victory"]], "faith": ["gnesio-catholic", "utraquist-rite"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "la-rochelle", "t": "battle", "name": "Siege of La Rochelle", "st": "hist", "when": "1627–28", "y": 1627, "y2": null, "sum": "The fall of the hardline Huguenots’ main fortress.", "body": ["After La Rochelle falls the hardline Reformed shrink to the Cévennes and Béarn’s mountains. Cranmerian Huguenots are protected and nothing is revoked."], "facts": [["Date", "1627–28"], ["Place", "La Rochelle"], ["Sides", "France against the Huguenots"], ["Result", "Royal victory"]], "faith": ["hardline-reformed", "gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "breitenfeld", "t": "battle", "name": "Battle of Breitenfeld", "st": "hist", "when": "17 September 1631", "y": 1631, "y2": null, "sum": "Swedish victory that opens Germany to Gustavus Adolphus.", "body": ["Sweden enters the German war as protector of the Gnesio-Catholics, though France leads the anti-Habsburg side as protector of the Lyon-aligned churches."], "facts": [["Date", "17 September 1631"], ["Place", "Near Leipzig"], ["Sides", "Sweden and Saxony against the Empire"], ["Result", "Swedish victory"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lutzen", "t": "battle", "name": "Battle of Lützen", "st": "hist", "when": "16 November 1632", "y": 1632, "y2": null, "sum": "Swedish victory in which Gustavus Adolphus is killed.", "body": ["The king’s death leaves Sweden under a regency of Oxenstierna in the name of Christina."], "facts": [["Date", "16 November 1632"], ["Place", "Near Lützen"], ["Sides", "Sweden against the Empire"], ["Result", "Swedish victory; Gustavus Adolphus killed"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "polyanovka", "t": "battle", "name": "Smolensk War and the Peace of Polyanovka", "st": "hist", "when": "1632–34", "y": 1634, "y2": null, "sum": "Russia’s failed siege of Smolensk, ending in Polish gains.", "body": ["Poland keeps Smolensk. The war leaves Poland strong on the eastern frontier as Russia’s catechism sets it further from the Greek world."], "facts": [["Date", "1632–34"], ["Place", "Smolensk"], ["Sides", "Russia against Poland-Lithuania"], ["Result", "Russian siege fails; Poland keeps Smolensk"]], "faith": ["russian-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "nordlingen", "t": "battle", "name": "Battle of Nördlingen", "st": "hist", "when": "5–6 September 1634", "y": 1634, "y2": null, "sum": "Imperial victory that breaks the Swedish position in south Germany.", "body": ["Württemberg is occupied by imperial troops after it. Saxony and Brandenburg make peace at Prague the next spring, and France leads the war."], "facts": [["Date", "5–6 September 1634"], ["Place", "Nördlingen"], ["Sides", "Empire and Spain against Sweden and German allies"], ["Result", "Imperial victory"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "english-war", "t": "battle", "name": "The English War", "st": "canon", "when": "c.1640–1660", "y": 1640, "y2": null, "sum": "A civil war in two stages: the Royalists, then the Reforming Crown's army, with a king deposed and a Stuart restoration.", "body": ["The Royalists (the bishops, the nobility and the Navy) fight in the king's name against his reforming ministers. When Charles I openly sides with the Commons, they back his son, the future Charles II ([[charles-ii]]). The king is deposed and lives in exile.", "A West Country minority, the [[byzantinists]], holds the west. The proposed course: Edgehill is indecisive; the Royalists win at Lansdown and Naseby ([[naseby]]), where the king is deposed; the Reforming Crown's army under Fairfax and Cromwell wins in the north at Marston Moor and Preston ([[preston-1648]]) and holds the country until 1660, when the restoration brings Charles II back and establishes the conservative, French-aligned monarchy. William of Orange ends it by force in 1688 ([[william-iii]]).", "The 1648 snapshot shows the war. The 1660 snapshot shows the restoration."], "facts": [["Date", "c.1640–1660"], ["Place", "England"], ["Sides", "Reforming Crown against Royalists"], ["Result", "Royalist restoration (canon)"]], "faith": ["cranmerian", "byzantinists"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["Whether the proposed course of the battles is acceptable, in particular who holds London between about 1646 and 1660."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": [], "result": "Charles I deposed and exiled; Royalist restoration under Charles II in 1660"}, {"id": "pereiaslav-war", "t": "battle", "name": "The Khmelnytsky Rising", "st": "canon", "when": "1648–54", "y": 1648, "y2": null, "sum": "The Cossack rising that ends in the Pereiaslav union with Moscow.", "body": ["Khmelnytsky’s rising begins in 1648 as in history. Pereiaslav in 1654 ([[pereiaslav]]) puts Kiev under Moscow, which absorbs the Kievan critics of the catechism."], "facts": [["Date", "1648–54"], ["Place", "Ukraine"], ["Sides", "Cossacks against Poland-Lithuania"], ["Result", "Union with Muscovy, 1654"]], "faith": ["eastern-orthodox", "russian-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "deluge", "t": "battle", "name": "The Deluge", "st": "canon", "when": "1655–60", "y": 1655, "y2": null, "sum": "The Swedish and Russian invasions of Poland-Lithuania.", "body": ["Polish toleration survives the Deluge, and Kaunas emerges stronger in this timeline. The war strengthens the Gnesio-Catholic bishopric’s position."], "facts": [["Date", "1655–60"], ["Place", "Poland-Lithuania"], ["Sides", "Poland against Sweden and Russia"], ["Result", "Poland survives; toleration intact"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "great-turkish-war", "t": "battle", "name": "The Great Turkish War", "st": "prop", "when": "1683–99", "y": 1683, "y2": null, "sum": "Proposed: the Habsburg reconquest of Hungary, ending at Karlowitz.", "body": ["The 1700 snapshot shows the Habsburg reconquest after Karlowitz. This entry is a placeholder that follows the history of the same name."], "facts": [["Date", "1683–99"], ["Place", "Hungary and the Balkans"], ["Sides", "Holy League against the Ottoman Empire"], ["Result", "Habsburg reconquest of Hungary"]], "faith": ["roman-catholic", "sunni"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lateran-v", "t": "doc", "name": "Fifth Lateran Council", "st": "hist", "when": "1512–17", "y": 1512, "y2": null, "sum": "Reform council that sits before any evangelical movement exists.", "body": ["Called by Julius II and closed under Leo X, Lateran V passes reforming decrees that history largely left unenforced. It is the baseline against which the timeline’s changes are measured."], "facts": [["Date", "1512–17"], ["Kind", "Council or treaty"], ["Parties", "Papacy and bishops"], ["Effect", "Reform decrees; curial resistance"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "concordat-of-bologna", "t": "doc", "name": "Concordat of Bologna", "st": "canon", "when": "1516", "y": 1516, "y2": null, "sum": "Agreement between Leo X and Francis I giving the king nomination of bishops.", "body": ["Rome still confirms French bishops under this concordat, which is why it can accept the Lyon primacy. It is the legal basis of the Gallican settlement and the reason the Papacy loses little by it."], "facts": [["Date", "1516"], ["Kind", "Council or treaty"], ["Parties", "Leo X and Francis I"], ["Effect", "Crown nominates bishops; pope confirms"]], "faith": ["gallican-church", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "council-of-trent", "t": "doc", "name": "Council of Trent", "st": "canon", "when": "1545–63", "y": 1545, "y2": null, "sum": "The council whose Session 6 allows imputed righteousness in 1547.", "body": ["In this timeline Session 6 is softened, allowing imputed righteousness beside inherent righteousness, and Session 5 on original sin stands as written. France never receives the decrees. Historically France delayed reception until the clergy’s declaration of 1615. Here the Gallican settlement exempts it, so communion holds while French doctrine takes its own path.", "A proposed driver is the Spirituali party under Pole and Morone, with Contarini’s Regensburg formula as the model."], "facts": [["Date", "1545–63"], ["Kind", "Council or treaty"], ["Parties", "Pope, legates, bishops"], ["Effect", "More Augustinian Roman communion"]], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["Who presides and how the council ends after 1549."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "augsburg-interim", "t": "doc", "name": "The Augsburg Interim", "st": "canon", "when": "1548–55", "y": 1548, "y2": 1555, "sum": "Charles V’s religious settlement after Mühlberg, which splits the Wittenberg movement.", "body": ["Enforced by imperial troops in Württemberg and the Upper German cities. Accepted as the Leipzig compromise in Albertine Saxony and Brandenburg, refused in Ernestine Thuringia, Magdeburg, Hamburg, Lübeck, Lüneburg, Mecklenburg and the Neumark.", "The failed [[princes-revolt]] does not secure the historical termination of the Interim at Passau. Enforcement remains uneven and contested until the [[peace-of-augsburg]] supplies a new legal framework in 1555. In Saxony, Augustus’s Gnesio turn changes the court’s response to the earlier Leipzig compromise."], "facts": [["Date", "1548–55"], ["Kind", "Council or treaty"], ["Parties", "Emperor and princes"], ["Effect", "Splits Philippists and Gnesio-Lutherans"]], "faith": ["cranmerian", "gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "peace-of-augsburg", "t": "doc", "name": "Peace of Augsburg", "st": "canon", "when": "1555", "y": 1555, "y2": null, "sum": "A religious peace that never says which Augsburg Confession it protects.", "body": ["After the failed [[princes-revolt]], the Emperor’s side negotiates from strength. Political victory nevertheless leaves the cost of enforcement and the unresolved confessional loyalties of the estates. The peace recognizes the Augsburg Confession without deciding which reading of it is protected.", "Both Philippists and Gnesio adherents claim its protection. The failed Passau settlement gives neither party a simple claim that armed resistance secured its liberties. The ambiguity sends disputes to the courts and Diets; Maximilian II’s tolerance later helps keep the arrangement workable."], "facts": [["Date", "1555"], ["Kind", "Council or treaty"], ["Parties", "Emperor and Diet"], ["Effect", "Ambiguous recognition of the Augsburg Confession"]], "faith": ["cranmerian", "gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["The precise restrictions on military association carried from the 1549 settlement into the peace of 1555."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lambeth-council", "t": "doc", "name": "Council of Lambeth", "st": "canon", "when": "1549–52", "y": 1549, "y2": null, "sum": "The international council that answers imperial victory with a confession and an apostolic constitution.", "body": ["The prolonged [[schmalkaldic-war]] ends in negotiated imperial victory in 1549. Cranmer gathers English bishops and continental representatives at Lambeth from 1549 to 1552. Melanchthon, Bullinger’s envoys, Vermigli, à Lasco and Bucer participate; Bucer dies in 1551 before the council ends.", "The council adopts the eucharistic [[lambeth-formula]] and the [[lambeth-constitution]]. Existing ministers are recognized. New bishops representing continental synods receive joint English–Lutheran ordination. The [[unchanged-ordinal]] supplies a controversial argument for continuity of ministry.", "The defeat of the [[princes-revolt]] in 1552 reinforces the need for foreign protection while exposing the limits of pan-Protestant solidarity. Gnesio dissidents reject the sacramental compromise; Reformed dissenters object to consecration, the retained rite and episcopal government. Some German principalities and Dutch towns remain outside.", "Mary’s restoration in England then tests whether the Communion can survive without its founding host. Continental churches shelter exiles and sustain its agreements until Elizabeth restores it in England."], "facts": [["Date", "1549–52"], ["Kind", "Council or treaty"], ["Parties", "Cranmer, Melanchthon, Vermigli, à Lasco, Bucer, English bishops"], ["Effect", "Agreed confession; the Communion forms; Geneva stays outside"]], "faith": ["cranmerian", "hardline-reformed"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["Which English bishop and Lutheran superintendent perform the first joint ordinations."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lambeth-formula", "t": "doc", "name": "The Lambeth Formula", "st": "canon", "when": "1552", "y": 1552, "y2": null, "sum": "The eucharistic compromise: Christ is spiritually present through the Spirit and the consecration, and received to benefit by faith.", "body": ["The formula sits between three positions. It rejects transubstantiation and the Lutheran bodily presence (ubiquity). It also rejects pure receptionism, the view that Christ is present only in the faithful receiver's act of receiving. The presence follows the consecration, and does not depend on the worth or faith of the person eating; the benefit does depend on faith.", "It is this that the strict Calvinists cannot sign, and why they stay out of the united front ([[hardline-reformed]]). The classical exposition is John Cosin's ([[john-cosin]]), who lived a century later and is proposed as the formula's great interpreter, not its author."], "facts": [["Date", "1552"], ["Kind", "Confession"], ["Parties", "Cranmer and the Lambeth delegates"], ["Effect", "Eucharistic settlement of the Communion"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["Whether Cosin's gloss is bound to the text of 1552."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "capitulation-of-wittenberg", "t": "doc", "name": "Capitulation of Wittenberg", "st": "canon", "when": "19 May 1547", "y": 1547, "y2": null, "sum": "John Frederick surrenders the electorate and Wittenberg to the Emperor.", "body": ["John Frederick yields Wittenberg and the electoral dignity to the Emperor, who grants the electorate to [[maurice-of-saxony]]. The Ernestine dynasty retains its Thuringian lands.", "The capitulation ends this phase of Saxon resistance. It does not end the [[schmalkaldic-war]], which continues elsewhere until the negotiated settlement of 1549."], "facts": [["Date", "19 May 1547"], ["Kind", "Treaty"], ["Parties", "Emperor, John Frederick, Maurice of Saxony"], ["Effect", "Electorate to Maurice; Ernestine Thuringia kept"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "poissy", "t": "doc", "name": "Colloquy of Poissy", "st": "canon", "when": "1561", "y": 1561, "y2": null, "sum": "The French colloquy that partly succeeds here, giving France a framework for settlement.", "body": ["In our history Cardinal Tournon opposed Beza and the colloquy failed. Here it works, and the framework ratified around 1576–77 gives France the Gallican–Augustinian settlement under the Primate of Lyon, with the Cranmerian Huguenots protected. The settlement’s success needs an explanation that the timeline has not yet written."], "facts": [["Date", "1561"], ["Kind", "Council or treaty"], ["Parties", "Crown, Roman and Reformed delegates"], ["Effect", "Gallican–Augustinian framework"]], "faith": ["gallican-church", "cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["What carries Poissy through the later wars despite Tournon.", "The exact ratification date."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "consensus-of-sandomierz", "t": "doc", "name": "Consensus of Sandomierz", "st": "canon", "when": "1570", "y": 1570, "y2": null, "sum": "Agreement among Polish evangelicals that brings Poland into the Cranmerian communion.", "body": ["The Lutherans, Reformed and Brethren agree. In this timeline the Consensus becomes Poland’s entry point into the Cranmerian–Philippist Communion."], "facts": [["Date", "1570"], ["Kind", "Council or treaty"], ["Parties", "Polish evangelical churches"], ["Effect", "Poland joins the Communion"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "warsaw-confederation", "t": "doc", "name": "Warsaw Confederation", "st": "canon", "when": "1573", "y": 1573, "y2": null, "sum": "The Polish pledge of religious toleration, here naming Gnesio-Catholic congregations.", "body": ["Historically the Confederation was a general pledge of peace between confessions. In this timeline Ducal Prussia’s Gnesio-Catholic church is named under Polish overlordship, and a recognised bishopric in Lithuania gives a bridge toward Russia."], "facts": [["Date", "1573"], ["Kind", "Council or treaty"], ["Parties", "Polish nobility"], ["Effect", "Toleration, with Gnesio-Catholic recognition"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "bohemian-union-1575", "t": "doc", "name": "The Bohemian Union", "st": "canon", "when": "1575", "y": 1575, "y2": null, "sum": "The union of the Utraquists with the Gnesio-Catholics that fixes the church’s name and theology.", "body": ["Bohemia’s Utraquists unite with the Gnesio-Lutherans, and the Unity of the Brethren goes to Cranmer. The union makes Bohemia the largest Gnesio-Catholic stronghold. It is the moment the name ‘Gnesio-Catholic’ comes into use, with seven sacraments and the Roman ordination formula."], "facts": [["Date", "1575"], ["Kind", "Council or treaty"], ["Parties", "Utraquists and Gnesio-Lutherans"], ["Effect", "Gnesio-Catholic church formed"]], "faith": ["gnesio-catholic", "utraquist-rite", "unity-brethren"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "red-book", "t": "doc", "name": "The Red Book of Sweden", "st": "canon", "when": "1576", "y": 1576, "y2": null, "sum": "John III’s liturgy, which leans toward the ancient church.", "body": ["The Red Book moves Sweden toward Gnesio-Catholicism. The Uppsala Synod of 1593 completes the work."], "facts": [["Date", "1576"], ["Kind", "Council or treaty"], ["Parties", "King John III"], ["Effect", "Liturgy moves Sweden toward Gnesio-Catholicism"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "uppsala-synod", "t": "doc", "name": "Synod of Uppsala", "st": "canon", "when": "1593", "y": 1593, "y2": null, "sum": "The synod that settles Sweden’s church.", "body": ["Under Archbishop Abraham Angermannus the synod fixes Sweden as Gnesio-Catholic. Duke Charles later defends the settlement against Sigismund."], "facts": [["Date", "1593"], ["Kind", "Council or treaty"], ["Parties", "Church of Sweden"], ["Effect", "Gnesio-Catholic Sweden"]], "faith": ["gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "brest", "t": "doc", "name": "Union of Brest", "st": "canon", "when": "1596", "y": 1596, "y2": null, "sum": "The union of Ruthenian bishops with Rome.", "body": ["Occurs as in history. The bishops accept union. Many parishes, the Lviv brotherhood and the Ostroh circle do not. Moscow’s Western-Rite church is its mirror: a Western liturgy inside Orthodoxy."], "facts": [["Date", "1596"], ["Kind", "Council or treaty"], ["Parties", "Ruthenian bishops and Rome"], ["Effect", "Uniate Church formed"]], "faith": ["ruthenian-uniate", "eastern-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "xanten", "t": "doc", "name": "Treaty of Xanten and the Neuburg Conversion", "st": "canon", "when": "1613–14", "y": 1613, "y2": null, "sum": "The partition of Jülich-Cleves, with Neuburg turning Gnesio-Catholic under Lyon.", "body": ["Wolfgang Wilhelm of Neuburg converts to the Gnesio-Catholic church in 1613 to win French backing. Neuburg takes Jülich and Berg under Lyon, and Cleves and Mark go to Brandenburg. Henry IV’s assassination in 1610 means France arrives through Lyon rather than at the head of an army."], "facts": [["Date", "1613–14"], ["Kind", "Council or treaty"], ["Parties", "Neuburg, Brandenburg, France"], ["Effect", "Jülich-Berg to Neuburg; Cleves-Mark to Brandenburg"]], "faith": ["gnesio-lyon"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "stolbovo", "t": "doc", "name": "Treaty of Stolbovo", "st": "canon", "when": "1617", "y": 1617, "y2": null, "sum": "Sweden takes Narva and Ingria, and treaty-protects the Western-Rite primate.", "body": ["An Orthodox see survives inside Gnesio-Catholic Sweden as a working bridge. Uppsala and Moscow both have reasons to keep it alive."], "facts": [["Date", "1617"], ["Kind", "Council or treaty"], ["Parties", "Sweden and Russia"], ["Effect", "Narva to Sweden; primate protected"]], "faith": ["western-rite-orthodox", "gnesio-independent"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "filaret-catechism", "t": "doc", "name": "Filaret’s Catechism", "st": "canon", "when": "1627", "y": 1627, "y2": null, "sum": "The Russian church’s catechism, in Gnesio-influenced terminology.", "body": ["Adopted under Patriarch Filaret as an anti-Latin weapon after the Polish occupation. It teaches penal substitutionary atonement, the material sufficiency of Scripture, the deuterocanon as apostolic tradition from the Second Temple, and dual imputation. Concupiscence as formally sinful is not allowed.", "Greek patriarchs condemn the formulas without breaking communion. Kiev-trained clergy resist."], "facts": [["Date", "1627"], ["Kind", "Document"], ["Parties", "Moscow Patriarchate"], ["Effect", "Russian church takes a Gnesio-influenced theology"]], "faith": ["russian-orthodox"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["How the catechism reconciles substitution with union with God."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "peace-of-prague", "t": "doc", "name": "Peace of Prague", "st": "hist", "when": "1635", "y": 1635, "y2": null, "sum": "The peace in which Saxony and Brandenburg leave the war.", "body": ["Both Cranmerian electors make peace with the Emperor as in history, so the war becomes France and Sweden against the Habsburgs."], "facts": [["Date", "1635"], ["Kind", "Council or treaty"], ["Parties", "Emperor, Saxony, Brandenburg"], ["Effect", "Cranmerian electors leave the war"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "peace-1648", "t": "doc", "name": "The Peace of 1648", "st": "canon", "when": "1648", "y": 1648, "y2": null, "sum": "The settlement that ends the great war, recognising Roman and Gnesio-Catholic churches in the Empire, with Lyon a guarantor.", "body": ["Canon records Lyon as a guarantor of the peace. The Empire recognises two confessions: the Roman and the Gnesio-Catholic. The Cranmerian Communion's princes shelter under the Augsburg Confession, and the Reformed hardliners and the Anabaptists are tolerated only."], "facts": [["Date", "1648"], ["Kind", "Council or treaty"], ["Parties", "Great powers"], ["Effect", "Roman and Gnesio-Catholic recognised; Lyon a gua ching of the Gospel as each community understands it. Transylvania recognises Roman, Cranmerian and Unitarian churches, with Gnesio-Catholics a possible fourth."], "facts": [["Date", "1568"], ["Kind", "Council or treaty"], ["Parties", "Transylvanian Diet"], ["Effect", "Toleration"]], "faith": ["unitarian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "edict-for-huguenots", "t": "doc", "name": "Edict Protecting Cranmerian Huguenots", "st": "canon", "when": "c.1598", "y": 1598, "y2": null, "sum": "Henry IV’s edict for the Cranmerian Huguenots.", "body": ["Date and name are not fixed. Nothing is revoked in this timeline, and in 1685 the Cranmerian Huguenots are still protected."], "facts": [["Date", "c.1598"], ["Kind", "Council or treaty"], ["Parties", "Henry IV and the Huguenots"], ["Effect", "Toleration for Cranmerian Huguenots"]], "faith": ["gallican-church", "cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["Name and date of the edict."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "martin-luther", "t": "person", "name": "Martin Luther", "st": "hist", "when": "1483–1546", "y": 1517, "y2": 1546, "sum": "The Wittenberg reformer, whose heritage both the Gnesio-Catholics and the Philippists claim.", "body": ["Luther’s theses of 1517 and the Diet of Worms in 1521 happen as in history, since the divergence at Marignano in 1515 touches Zurich, not Wittenberg. He dies in February 1546, months before the [[schmalkaldic-war]]. His doctrine of the bodily presence in the sacrament is the line the Gnesio-Catholics keep, and his table of justification by faith alone is the line the whole Reformation family keeps."], "facts": [], "faith": ["gnesio-catholic", "cranmerian"], "office": "Reformer of Wittenberg", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Martin Luther", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "johannes-bugenhagen", "t": "person", "name": "Johannes Bugenhagen", "st": "hist", "when": "1485–1558", "y": 1537, "y2": 1558, "sum": "Wittenberg’s pastor and the organiser of church orders in the north, who introduced superintendents.", "body": ["Bugenhagen drew up church orders for Brunswick, Hamburg, Lübeck, Pomerania and, in 1537, Denmark, where he crowned Christian III. His superintendents, regional overseers who were not called bishops, are the ancestors of the archpresbyters of the Cranmerian structure ([[cranmerian]])."], "facts": [], "faith": ["cranmerian", "gnesio-catholic"], "office": "Superintendent and church organiser", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Johannes Bugenhagen", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "johann-eck", "t": "person", "name": "Johann Eck", "st": "hist", "when": "1486–1543", "y": 1519, "y2": 1543, "sum": "Luther’s Roman opponent at Leipzig in 1519.", "body": ["Eck’s debate with Luther in 1519 is the first great test of papal primacy. He dies in 1543, before Trent opens, so the Roman case at the council is argued by others."], "facts": [], "faith": ["roman-catholic"], "office": "Theologian", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Johann Eck", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "johann-gerhard", "t": "person", "name": "Johann Gerhard", "st": "canon", "when": "1582–1637", "y": 1616, "y2": 1637, "sum": "Jena professor, proposed as Bishop of Jena for the Gnesio-Catholic church of Saxe-Weimar.", "body": ["In our history Gerhard was the great systematic theologian of Lutheran orthodoxy at Jena from 1616. The Jena seat is on the 1635 map with no holder in canon. He is the natural occupant, and his Loci theologici would be the Gnesio-Catholic church’s standard dogmatics."], "facts": [], "faith": ["gnesio-independent", "gnesio-catholic"], "office": "Bishop of Jena", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Johann Gerhard", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "martin-chemnitz", "t": "person", "name": "Martin Chemnitz", "st": "prop", "when": "1522–86", "y": 1565, "y2": 1586, "sum": "Brunswick theologian whose Examination of the Council of Trent is the evangelical answer to Rome.", "body": ["Chemnitz was a pillar of the Lutheran confession in Brunswick. In this timeline Trent's Session 6 allows imputed righteousness, so his Examination of the Council of Trent is a different book: it turns on the Mass, the sacraments and primacy, not on justification. He holds no office beyond his pastorate."], "facts": [], "faith": ["cranmerian"], "office": "Theologian of Brunswick", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Martin Chemnitz", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "johannes-wigand", "t": "person", "name": "Johannes Wigand", "st": "hist", "when": "1523–87", "y": 1560, "y2": 1587, "sum": "Gnesio theologian, co-author of the Magdeburg Centuries and bishop of Pomesania.", "body": ["Wigand worked with [[flacius]] on the Magdeburg Centuries, the great Gnesio church history, and held the see of Pomesania in Prussia from 1575. In this timeline Prussia is a Gnesio-Catholic church under Polish overlordship, so his office becomes part of the episcopal succession."], "facts": [], "faith": ["gnesio-independent", "gnesio-catholic"], "office": "Bishop of Pomesania", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Johannes Wigand", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "laurentius-petri", "t": "person", "name": "Laurentius Petri", "st": "hist", "when": "1499–1573", "y": 1531, "y2": 1573, "sum": "First evangelical Archbishop of Uppsala, consecrated in the unbroken Swedish succession.", "body": ["Laurentius Petri was consecrated in 1531 by a bishop whose own consecration came from Rome, which is why Sweden’s succession counts as unbroken. This is the line from which Swedish bishops later consecrate the first Gnesio-Catholic bishops ([[gnesio-catholic]])."], "facts": [], "faith": ["gnesio-independent"], "office": "Archbishop of Uppsala", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Laurentius Petri", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "petrus-magni", "t": "person", "name": "Petrus Magni", "st": "hist", "when": "c.1470–1534", "y": 1524, "y2": 1534, "sum": "Bishop of Västerås, consecrated at Rome in 1524, who consecrated Laurentius Petri.", "body": ["Magni is the hinge of the Swedish succession. Without him the Gnesio-Catholics’ claim to episcopal ordination in the old line would not hold."], "facts": [], "faith": ["gnesio-independent"], "office": "Bishop of Västerås", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Petrus Magni", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "jonas-bretkunas", "t": "person", "name": "Jonas Bretkūnas", "st": "canon", "when": "1536–1602", "y": 1573, "y2": 1602, "sum": "Königsberg pastor and translator of the first Lithuanian Bible, proposed as the first Gnesio-Catholic bishop of Kaunas.", "body": ["Bretkūnas served in Königsberg and translated the Bible into Lithuanian by 1590. A recognised Gnesio-Catholic bishopric in Lithuania is canon, seated at Kaunas on the trade route from Prussia. He is the natural first holder and the language bridge between Prussia and Lithuania."], "facts": [], "faith": ["gnesio-independent"], "office": "Bishop of Kaunas", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Jonas Bretkūnas", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "john-cosin", "t": "person", "name": "John Cosin", "st": "prop", "when": "1595–1672", "y": 1625, "y2": 1672, "sum": "The classical expositor of the Cranmerian eucharistic formula: spiritual presence, through consecration, not dependent on the receiver.", "body": ["In our history Cosin was a high-church Caroline bishop of Durham who held that Christ is truly present because of the consecration, and who rejected both transubstantiation and the view that the presence exists only in the receiving. This timeline gives his teaching to the Communion. The [[lambeth-formula]] says Christ is present spiritually, through the Spirit and the consecration, and the benefit is by faith.", "Cosin was born in 1595, so he cannot have written the 1552 formula. He is its great exposition, the figure whose books make the compromise respectable to the English clergy and to Hemmingsen's Denmark. In the English War he stands with the Royalist establishment and the Byzantinist circle ([[byzantinists]]). The hardline Reformed hold that presence comes only to the believing receiver, and that is why they refuse the united front ([[hardline-reformed]])."], "facts": [], "faith": ["cranmerian", "byzantinists"], "office": "Bishop and eucharistic theologian", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": ["Whether the formula is Lambeth's own text or Cosin's later gloss on it."], "branch_of": nul Arminius ([[arminius]]). The Remonstrants ([[remonstrants]]) are condemned and Oldenbarnevelt ([[oldenbarnevelt]]) is executed in 1619, with Maurice of Nassau ([[maurice-of-nassau]]) behind the verdict. Grotius ([[grotius]]) is imprisoned. The Dutch church's strictness here sits uneasily with the wider formula of Lambeth ([[lambeth-formula]]), which the Hemmingsen line prefers."], "facts": [["Date", "1618–19"], ["Kind", "Synod"], ["Parties", "Dutch church and states"], ["Effect", "Remonstrants condemned; Oldenbarnevelt executed"]], "faith": ["cranmerian", "hardline-reformed"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "edict-of-restitution", "t": "doc", "name": "Edict of Restitution", "st": "hist", "when": "1629", "y": 1629, "y2": null, "sum": "Ferdinand II demands the return of church lands.", "body": ["The edict ([[ferdinand-ii]]) sets the north against the Emperor and Sweden lands in 1630."], "facts": [["Date", "1629"], ["Kind", "Edict"], ["Parties", "Ferdinand II"], ["Effect", "Church land restitution"]], "faith": ["roman-catholic", "gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "synod-of-jerusalem-1672", "t": "doc", "name": "Synod of Jerusalem", "st": "canon", "when": "1672", "y": 1672, "y2": null, "sum": "The Greek counterpart to Trent or Florence: a reform council that reaches agreement with the Armenian Church.", "body": ["Dositheos of Jerusalem ([[dositheos-of-jerusalem]]) convenes the synod as the Greek world's answer to Trent and Florence, in importance if not in size. Its aim is to compete with the Russians, whose catechism ([[filaret-catechism]]) has split Moscow from the Greeks doctrinally, and eventually to influence them. It condemns the Russian formulas and the Calvinising confession tradition of Lucaris ([[cyril-lucaris]], [[peter-mohyla]]) without breaking communion with Moscow.", "Its reforms cover the liturgy, the seminaries and the clergy. The Greek rite is revised and printed from a corrected text. Seminaries are reformed on a model that borrows from both sides: Byzantine teachers and Roman Catholic help, as with the Greek College in Rome, and the Kievan scholastic method that Moscow has taken in after Pereiaslav ([[pereiaslav]]). Graduates are meant to staff the Greek, Serbian and Ruthenian churches and to argue with Moscow on its own ground.", "The agreement with the Armenian Church is its largest act. The Greeks accept the Cyrilline formula, 'one incarnate nature of God the Word', as compatible with Chalcedon, and the Armenians accept that Chalcedon's two natures were not Nestorian. Catholicos Hakob IV of Julfa ([[hakob-iv-julfa]]) signs for Etchmiadzin, with the Armenian scholars of Constantinople and the printers of Amsterdam ([[voskan-yerevantsi]]). The Armenians keep their liturgy, calendar and episcopal order, and their trade diaspora in Venice, Isfahan, Lviv and Astrakhan carries the reforms into the Russian and Polish-Lithuanian world ([[miaphysite]])."], "facts": [["Date", "1672"], ["Kind", "Synod"], ["Parties", "Greek patriarchates and the Armenian Church"], ["Effect", "Liturgy and seminary reform; agreement with the Armenians"]], "faith": ["eastern-orthodox", "russian-orthodox", "miaphysite"], "office": null, "rel": [], "color": null, "basis": null, "open_q": ["How the Armenian Patriarchate of Constantinople and the Catholicate of Etchmiadzin divide authority after the agreement.", "Whether the Copts and the Syriac patriarchate follow later, as a partial agreement."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gallican-articles-1682", "t": "doc", "name": "Gallican Articles", "st": "canon", "when": "1682", "y": 1682, "y2": null, "sum": "The French clergy restate the existing Gallican settlement.", "body": ["Bossuet ([[bossuet]]) drafts the four articles for Louis XIV ([[louis-xiv]]). Because the Lyon primacy and the 1516 concordat ([[concordat-of-bologna]]) already fix the balance, they add nothing new: they restate the settlement."], "facts": [["Date", "1682"], ["Kind", "Declaration"], ["Parties", "French clergy and Louis XIV"], ["Effect", "Restates Gallican liberties"]], "faith": ["gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "karlowitz", "t": "doc", "name": "Treaty of Karlowitz", "st": "hist", "when": "1699", "y": 1699, "y2": null, "sum": "The Ottomans give up Hungary.", "body": ["Leopold I ([[leopold-i]]) gains most of Hungary after Zenta ([[zenta]])."], "facts": [["Date", "1699"], ["Kind", "Treaty"], ["Parties", "Habsburgs, Poland, Venice, Ottomans"], ["Effect", "End of the Great Turkish War"]], "faith": ["roman-catholic", "sunni"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "zelanti", "t": "faction", "name": "The Zelanti", "st": "hist", "when": "1540s–1560s", "y": 1555, "y2": null, "sum": "The hard-line cardinals who opposed the Spirituali.", "body": ["Led by Gian Pietro Carafa ([[gian-pietro-carafa]]), they distrust any compromise on justification. In this timeline they lose at Trent ([[council-of-trent]]) but remain a strong curial party."], "facts": [], "faith": ["roman-catholic"], "office": null, "rel": [["spirituali", "The opposing party."]], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "jesuits", "t": "faction", "name": "The Jesuits", "st": "hist", "when": "1540–1773", "y": 1540, "y2": null, "sum": "The Society founded by Ignatius Loyola.", "body": ["Ignatius ([[ignatius-loyola]]), Canisius ([[peter-canisius]]) and Bellarmine ([[robert-bellarmine]]) shape the Roman response. Under a softened Trent the Society argues for the Roman case in Poland, Bohemia and the Rhineland."], "facts": [], "faith": ["roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "josephites", "t": "faction", "name": "Josephites and Non-Possessors", "st": "hist", "when": "c.1503–1580s", "y": 1503, "y2": null, "sum": "Rival parties in the Russian church over monastic land.", "body": ["Joseph Volotsky ([[joseph-volotsky]]) defended monastic property and a strong monarchy. Nil Sorsky ([[nil-sorsky]]) taught that monks should hold no land. The Josephites win in history, and the same tension returns in the quarrel over the catechism."], "facts": [], "faith": ["russian-orthodox"], "office": null, "rel": [["kiev-resisters", "A later quarrel with a similar shape."]], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "remonstrants", "t": "faction", "name": "The Remonstrants", "st": "canon", "when": "1610–1619", "y": 1610, "y2": null, "sum": "The Dutch party of wider grace around Arminius, condemned at Dort.", "body": ["In history they were condemned at Dort ([[synod-of-dort]]). In a Communion whose formula allows spiritual presence by consecration, they might be an accepted wing. Whether the quarrel sets them outside is open."], "facts": [], "faith": ["cranmerian"], "office": null, "rel": [["hardline-reformed", "The strict party that opposes them."]], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beli nz.", "body": ["Kepler's laws appear in 1609. In history his Lutheran church excommunicated him over the Eucharist. Under the Lambeth formula ([[lambeth-formula]]) his sacramental views fit inside the Communion, so he is not excommunicated."], "facts": [], "faith": ["cranmerian"], "office": "Mathematician and astronomer", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "scholar", "wiki": "Johannes Kepler", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "galileo", "t": "person", "name": "Galileo Galilei", "st": "canon", "when": "1564–1642", "y": 1633, "y2": 1642, "sum": "Pisan astronomer tried by the Roman Inquisition in 1633.", "body": ["Urban VIII's court condemns Galileo in 1633 ([[urban-viii]]), as in history. A softer Trent does not change the Inquisition's natural philosophy."], "facts": [], "faith": ["roman-catholic"], "office": "Astronomer and physicist", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "scholar", "wiki": "Galileo Galilei", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "mercator", "t": "person", "name": "Gerardus Mercator", "st": "hist", "when": "1512–94", "y": 1569, "y2": 1594, "sum": "Cartographer of Duisburg.", "body": ["Mercator's projection of 1569 is made in Cleves, the duchy that [[xanten]] later assigns to Brandenburg."], "facts": [], "faith": ["cranmerian"], "office": "Cartographer", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "scholar", "wiki": "Gerardus Mercator", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "plantin", "t": "person", "name": "Christophe Plantin", "st": "hist", "when": "c.1520–89", "y": 1568, "y2": 1589, "sum": "Antwerp printer of the Polyglot Bible.", "body": ["Plantin prints for Philip II ([[philip-ii]]) in a city that Farn
