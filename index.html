* { box-sizing: border-box; }
html { scroll-padding-top: 12px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.55;

a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

.brand { display: block; text-decoration: none; color: var(--ink); }

.menu-btn { display: none; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; font-size: 16px; }

.nav a:hover { background: var(--chip); }

.nav .n { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); font-weight: 400; }
.nav a[aria-current="page"] .n { color: var(--accent-ink); opacity: .85; }
.nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; width: 100%; }
.key { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.key div { display: flex; gap: 8px; align-items: baseline; }
.tool { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
.tool:hover { background: var(--chip); }

main { min-width: 0; padding-block: 32px 72px; }
.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1.08; margin: 6px 0 4px; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.when { font-family: var(--f-note); font-style: italic; color: var(--muted); font-size: 19px; }
.lede { font-family: var(--f-note); font-size: 21px; line-height: 1.42; margin: 14px 0 22px; max-width: 62ch; text-wrap: pretty; }

.badge { display: inline-block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 1px 8px; border-radius: 3px; line-height: 1.6; white-space: nowrap; }
.badge.canon { background: var(--canon-bg); color: var(--canon); border: 1px solid var(--canon); }

.badge.prop { background: var(--prop-bg); color: var(--prop); border: 1px dashed var(--prop); }

.layout { display: block; }
.facts { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 14px 16px; margin: 0 0 24px; font-size: 15px; }
.facts dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.facts dt { color: var(--muted); font-weight: 500; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts .basis { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; flex: none; }
.body p { margin: 0 0 14px; max-width: 66ch; text-wrap: pretty; }
a.x { text-decoration-style: dotted; }
.sec { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
.openq { border: 1px dashed var(--prop); background: var(--prop-bg); border-radius: 4px; padding: 12px 16px; margin-top: 28px; max-width: 66ch; }

.group h2 { margin-top: 28px; }
.table { width: 100%; border-collapse: collapse; font-size: 16px; }

.forks { counter-reset: none; list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 0; }

.forks .y { font-family: var(--f-note); font-style: italic; color: var(--muted); }
.stat { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 4px 0 22px; color: var(--muted); font-size: 15px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }

blockquote.src { margin: 10px 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--accent); font-family: var(--f-note); font-size: 18px; line-height: 1.5; }
.maplink { margin: 8px 0 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: 14px; }
img.ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; border-radius: 3px; background: var(--chip); margin-bottom: 4px; }
img.portrait { display: block; width: 100%; max-height: 360px; object-fit: contain; border-radius: 3px; margin: 0 0 12px; background: var(--chip); }
.beliefs { margin: 0; display: grid; gap: 4px 0; }
.beliefs dt { font-family: var(--f-display); font-size: 19px; margin-top: 12px; }
.beliefs dd { margin: 0; max-width: 68ch; }

the 1516 concordat, so Rome loses little and can accept it. Lyon becomes the court of appeal and the convener of the national synod. [[pierre-d-epinac]] is the first Primate to make the office effective.", "The settlement faced real resistance. The Parlement of Paris guards Gallican liberties against any churchman. Rouen and Sens historically refused Lyon’s primacy, and Rouen’s exemption survives as a standing grievance. The king backs Lyon as a counterweight to the Guise family’s power in the church.", "Henry IV converts to this church in 1589 and protects the Cranmerian Huguenots by edict. After 1610 Lyon extends its reach across the Rhine: the [[gnesio-lyon]] unions of Jülich and Berg come under it, and in 1648 Lyon is named a guarantor of the peace."], "facts": [["Head", "Primate of the Gauls at Lyon (Cardinal Alphonse de Richelieu in 1635)"], ["Communion", "Roman, by the concordat"], ["Theology", "Augustinian; Baianist schools tolerated"], ["Trent", "Decrees never received"], ["Map colour", "GAL pale gold"]], "faith": [], "office": null, "rel": [["roman-catholic", "In communion; Rome confirms French bishops."], ["gnesio-lyon", "Protects the Rhineland Gnesio-Catholic unions without absorbing them."], ["cranmerian", "Protects Cranmerian Huguenots by royal edict."]], "color": "#F1E1A6", "basis": null, "open_q": ["Rouen’s exemption from the Lyon primacy is unresolved.", "How Gallican doctrine on grace differs from Baianist teaching at Louvain."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Gallican liberties", "The Crown nominates and Rome confirms. A general council stands above the pope in disputes about the Church's constitution. The Tridentine decrees are never received in France."], ["Doctrine", "An Augustinian theology of grace, with its own catechism issued from Lyon. The treatment of concupiscence is a point of friction with Louvain ([[baianists]])."], ["Eucharist", "Transubstantiation, as in Rome. The Cranmerian Huguenots who live under the same Crown accept the Lambeth formula ([[lambeth-formula]]) instead."]], "structure": ["The Primate of Lyon ([[alphonse-de-richelieu]], [[pierre-d-epinac]]) convenes the national synod and acts as court of appeal. The Crown nominates bishops. Rome confirms them and keeps the communion. The Parlement of Paris ([[parlement-paris]]) is a watchful civil check."], "theologians": ["francis-de-sales", "du-perron", "pierre-de-berulle", "bossuet", "baius", "jansen"]}, {"id": "utraquist-rite", "t": "faith", "name": "Utraquist Rite in Union with Rome", "st": "canon", "when": "1620–1789", "y": 1620, "y2": null, "sum": "Bohemian Utraquists who accepted papal primacy after White Mountain in return for the chalice and a vernacular Mass.", "body": ["Before 1618 the Utraquists had merged with the Gnesio-Catholics (the [[bohemian-union-1575]]). After the defeat of the estates, the moderates make terms with Rome. The price is full union and papal primacy. The prize is communion in both kinds and a vernacular Mass, under the Archbishop of Prague, [[harrach]].", "The model is the Union of Brest, but in a Western rite. It is possible because Trent’s softened Session 6 lets Gnesio justification be read inside Roman bounds, and the Gnesio-Catholics already hold seven sacraments and the Roman ordination formula."], "facts": [["Head", "Archbishop of Prague"], ["Liturgy", "Vernacular Mass, chalice for laity"], ["Map colour", "BUR orange"]], "faith": [], "office": null, "rel": [["roman-catholic", "United 1620s–1635."], ["gnesio-catholic", "Parted from it at White Mountain; the hardliners went into exile."]], "color": "#D9944A", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Communion in both kinds", "The chalice for the laity, the old Hussite sign, now permitted by Rome as part of the settlement."], ["Vernacular liturgy", "Mass in Czech. Roman doctrine and papal primacy, which the Utraquists accept in return."], ["Justification", "Trent's softened Session 6 makes the union possible: the old Utraquist position on faith and works is no longer heretical."]], "structure": ["Under the Archbishop of Prague ([[harrach]]), in full union with Rome. It is modelled on the Union of Brest ([[brest]]) but in a Western rite."], "theologians": ["jan-rokyta"]}, {"id": "gnesio-catholic", "t": "faith", "name": "Gnesio-Catholic Church", "st": "canon", "when": "1575–1789", "y": 1575, "y2": null, "sum": "The heirs of the Gnesio-Lutherans: seven sacraments, the first seven councils, historic ordination, justification by faith alone.", "body": ["The Gnesio-Lutherans of [[flacius]], [[amsdorf]] and Ernestine Thuringia refused both Interims ([[augsburg-interim]]) and hardened against the Philippists. Their union with the Bohemian Utraquists in 1575 ([[bohemian-union-1575]]) fixes the name and the theology together. The legal banner is the original 1530 Augsburg Confession.", "The church holds seven sacraments, the first seven ecumenical councils and ordination by bishops in the old succession. Swedish bishops, consecrated in the pre-Reformation line, consecrate the first Gnesio-Catholic bishops. On justification it holds faith alone. On authority it is conciliar and episcopal, and it denies papal primacy. Those points make it a bridge between Rome, the Cranmerians and the Orthodox, and also explain why each kind of reunion would stall.", "By 1635 it has divided into three branches that are not yet churches in conflict. [[gnesio-independent]] runs from Uppsala through Saxe-Weimar and Magdeburg. [[gnesio-lyon]] holds Jülich and Berg under Lyon. [[gnesio-orthodox]] means the Western-Rite church at Narva. How those three drift apart is one of the timeline’s defining threads.", "Territories in 1635: Sweden, Saxe-Weimar, Magdeburg, Mansfeld, Ducal Prussia, a recognised bishopric in Lithuania, Neuburg’s Jülich and Berg, and exiled Bohemian congregations."], "facts": [["Sacraments", "Seven"], ["Councils", "First seven ecumenical"], ["Ordination", "Episcopal, in the old succession via Sweden"], ["Justification", "Faith alone"], ["Authority", "Conciliar and episcopal; no papal primacy"], ["Banner", "Augsburg Confession of 1530"], ["Map colour", "GNC plum"]], "faith": [], "office": null, "rel": [["cranmerian", "Rival Reformation family; the Philippist victory in 1550 shrank the Gnesio party to its core."], ["roman-catholic", "Negotiates only on primacy; Session 6 makes justification readable."], ["western-rite-orthodox", "Orthodox-aligned branch."], ["gallican-church", "Lyon-aligned branch."]], "color": "#6E2C4F", "basis": null, "open_q": ["Whether the first generation of Thuringian clergy, ordained before Swedish bishops were available, were validly ordained.", "A Gnesio-Catholic Sweden whose king is suspected of Cranmerian sympathies."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Justification", "By faith alone, as Luther taught, with the 1530 Augsburg Confession ([[augsburg-confession]]) as the legal banner."], ["Sacraments", "Seven sacraments and the real, bodily presence in the Eucharist. It rejects the Lambeth formula's spiritual presence ([[lambeth-formula]]) as too thin, and transubstantiation as too philosophical."], ["Church", "The first seven ecumenical councils. Ordination in the historic succession, carried through the Swedish line ([[petrus-magni]], [[laurentius-petri]])."], ["Adiaphora", "No ceremony may be imposed under pressure, which is the principle of the refusal of the Interim ([[augsburg-interim]], [[siege-magdeburg]])."]], "structure": ["Bishops in the historic succession, with synodal government. The union with the Bohemian Utraquists in 1575 ([[bohemian-union-1575]]) gave it its name. Three branches: the independent churches led from Uppsala ([[gnesio-independent]]), the Lyon-aligned Rhenish churches ([[gnesio-lyon]]) and the Orthodox-aligned churches ([[gnesio-orthodox]])."], "theologians": ["martin-luther", "flacius", "amsdorf", "johannes-wigand", "martin-chemnitz", "johann-gerhard", "laurentius-petri", "jonas-bretkunas"]}, {"id": "gnesio-independent", "t": "faith", "name": "Independent Gnesio-Catholics", "st": "canon", "when": "1575–1789", "y": 1593, "y2": null, "sum": "The branch led from Uppsala: Sweden, Saxe-Weimar, Magdeburg, Mansfeld, Prussia and Kaunas.", "body": ["This branch keeps the church’s own synodal order. [[uppsala-synod]] (1593) and the Red Book of 1576 ([[red-book]]) set the Swedish pattern. Saxe-Weimar’s bishop sits at Jena, Samland’s at Königsberg, Lithuania’s at Kaunas. Sweden guarantees Saxe-Weimar’s independence.", "It is the branch most likely to be squeezed. The 1648 settlement names Lyon a guarantor, which pulls the Rhine churches toward [[gnesio-lyon]]. Moscow’s protection of Narva pulls others toward [[gnesio-orthodox]]. What remains independent depends on whether Uppsala stays out of both orbits."], "facts": [["Seats", "Uppsala, Jena, Königsberg, Kaunas"], ["Map colour", "GNC plum"]], "faith": [], "office": null, "rel": [["gnesio-lyon", "Pulled toward it by France’s wartime leadership."], ["gnesio-orthodox", "Pulled toward it by the Narva treaty."]], "color": "#6E2C4F", "basis": null, "open_q": ["Where Sweden stands in the three-way drift after the great war."], "branch_of": "gnesio-catholic", "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gnesio-lyon", "t": "faith", "name": "Lyon-Aligned Gnesio-Catholics", "st": "canon", "when": "1613–1789", "y": 1613, "y2": null, "sum": "Rhineland Gnesio-Catholics, chiefly Jülich and Berg, in union with Lyon by special arrangement.", "body": ["Wolfgang Wilhelm of Palatinate-Neuburg converts to the Gnesio-Catholic church in 1613 to win French backing for his Jülich claim ([[wolfgang-wilhelm]]). He takes Jülich and Berg, and Brandenburg takes Cleves and Mark ([[xanten]]). The Düsseldorf bishop is under the Lyon primacy but is not merged into the Gallican Church.", "The map shows it as its own jurisdiction. It confirms that Gnesio-Catholics may accept Lyon’s protection without accepting Rome’s primacy."], "facts": [["Seat", "Düsseldorf"], ["Overseer", "Primate of Lyon, by special arrangement"], ["Map colour", "LYG mauve"]], "faith": [], "office": null, "rel": [["gallican-church", "Lyon is protector and appeal court."]], "color": "#B88A9E", "basis": null, "open_q": [], "branch_of": "gnesio-catholic", "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gnesio-orthodox", "t": "faith", "name": "Orthodox-Aligned Gnesio-Catholics", "st": "canon", "when": "1596–1789", "y": 1600, "y2": null, "sum": "The Western-Rite church at Narva and the Gnesio parishes that look east rather than to Rome or Lyon.", "body": ["This is the Orthodox end of the three-way drift. It is the same community as the [[western-rite-orthodox]] church seen from the Gnesio side: Western liturgy, an Orthodox creed and episcopate, and a theology close to Gnesio justification. It is the bridge between the Gnesio and Orthodox worlds."], "facts": [["Seat", "Narva"], ["Communion", "Moscow"], ["Map colour", "WRO blue"]], "faith": [], "office": null, "rel": [["western-rite-orthodox", "Same community, seen from the Gnesio side."]], "color": "#8E4A6C", "basis": null, "open_q": [], "branch_of": "gnesio-catholic", "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "cranmerian", "t": "faith", "name": "Cranmerian–Philippist Communion", "st": "canon", "when": "1549–1789", "y": 1549, "y2": null, "sum": "The wide evangelical communion formed at Lambeth, with a common confession and synodal episcopate.", "body": ["Cranmer’s international council sits at Lambeth from 1549 to 1552. Philippist communities in Saxony and Brandenburg join the wider communion, but the Gnesio turn of [[augustus-of-saxony]] after 1552 prevents a simple identification of electoral Saxony with the Philippist cause. Denmark-Norway and the Hungarian Reformed later give it further strength.", "It holds together rival theologies. Württemberg’s Lutheran teaching on Christ’s bodily presence sits beside Reformed-leaning churches. It is the Lutheran right wing of the communion, and the tension between them is one of its recurring disputes. The [[consensus-of-sandomierz]] brings in Poland, and the Unity of the Brethren ([[unity-brethren]]) joins after Bohemia’s revolt.", "In England its senior see is Canterbury. Under a king who favours a low-church settlement and economic reform, the establishment and the nobility lean Royalist, and a West Country party ([[byzantinists]]) looks east. These fights shape the English war of the 1640s ([[english-war]]).", "The [[lambeth-constitution]] recognizes existing ministers and provides joint ordination for new bishops representing synods. The [[unchanged-ordinal]] is retained despite Cranmer’s rejection of the Roman theology of the Mass. These institutional decisions are as controversial as the eucharistic agreement."], "facts": [["Council", "Lambeth, 1549–52"], ["Senior see", "Canterbury"], ["Other centres", "Dresden, Heidelberg, Copenhagen, The Hague, Zurich"], ["Authority", "Scripture, with the agreed confession"], ["Map colour", "CRA rose"]], "faith": [], "office": null, "rel": [["hardline-reformed", "Rejected the Cranmerian settlement; Scotland, Geneva, Vaud, Béarn."], ["gnesio-catholic", "Rival Reformation family."], ["byzantinists", "A Greek-leaning party in the English church."], ["unity-brethren", "Joined after 1575."]], "color": "#B04F6E", "basis": null, "open_q": ["How Württemberg’s teaching on the Eucharist fits the communion’s agreed confession.", "How Saxony passes from Augustus’s Gnesio turn to its later recorded Cranmerian alignment."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["The Lambeth formula", "Christ is spiritually present in the Supper through the Spirit and the consecration. The presence does not depend on the faith of the receiver, but the benefit does ([[lambeth-formula]]). This rejects transubstantiation, the Lutheran bodily presence and pure receptionism. The classical exposition is John Cosin's ([[john-cosin]])."], ["Episcopacy and ministry", "The [[lambeth-constitution]] treats episcopacy as providential and ultimately prudential in its apostolic development. Existing ministers are recognized; new synodal bishops receive joint English–Lutheran ordination. Cranmer retains the inherited rite for polemical continuity while rejecting the Roman theology of the Mass ([[unchanged-ordinal]])."], ["Justification", "By faith alone, in the evangelical sense of the Augsburg Confession ([[augsburg-confession]]) as read by Melanchthon."], ["Liturgy", "The Book of Common Prayer ([[book-of-common-prayer]]) in English, and vernacular liturgies on its pattern elsewhere."], ["The formula and the hardliners", "The formula is one reason the stricter Calvinists will not join; they also dispute the [[lambeth-constitution]] and [[unchanged-ordinal]]. In the Eucharist, they hold that the presence is given only in the believing reception ([[hardline-reformed]])."]], "structure": ["Two systems overlap. Bishops govern by diocese. Archpresbyters govern regions as the analogue of dioceses. A bishop and an archpresbyter are counterparts, and each can stand in the other's place at councils.", "Presbyterian consistories and synods sit under both and often overlap with them, so the lines of authority are tangled. Its shared constitution comes from Lambeth ([[lambeth-constitution]]): existing ministers are recognized, while new bishops representing synods receive joint ordination from an English bishop and a Lutheran superintendent. Continental churches retain superintendents and consistories ([[johannes-bugenhagen]]) and England brought bishops. Canterbury is the senior see, but it does not rule the Communion."], "theologians": ["cranmer", "melanchthon", "bucer", "vermigli", "a-lasco", "bullinger", "hemmingsen", "brenz", "john-jewel", "richard-hooker", "john-cosin", "zacharias-ursinus", "johannes-bugenhagen", "matthew-parker"]}, {"id": "hardline-reformed", "t": "faith", "name": "Hardline Reformed Churches", "st": "canon", "when": "1550–1789", "y": 1550, "y2": null, "sum": "The Calvinist churches that refused Cranmer’s settlement: Scotland’s Kirk, Geneva, Vaud, Béarn and the Huguenot south.", "body": ["Calvin and Beza hold Geneva ([[calvin]], [[beza]]), and Knox and Melville carry the pattern to Scotland ([[knox]]). When Cranmer’s council ([[lambeth-council]]) settles on a broader confession, these churches stand outside it. They are the strict end of the Reformed world: presbyterian order, tight discipline, no bishops.", "In France the Huguenots split three ways: hardliners in Béarn, Languedoc and La Rochelle, moderates in Normandy, Poitou and Dauphiné who join the Cranmerians, and a group of nobles and townsmen who reconcile with Lyon. The hardliners are broken by [[la-rochelle]] (1628) and shrink to the Cévennes and Béarn’s mountains.", "In Scotland the hardline Kirk is driven underground and run in secret, with ministers meeting in conventicles. Many of its members emigrate to the New World, to Ulster on the way and to New England, where they come to hold congregational polity. The established church of the Scottish crown is in the Cranmerian communion ([[james-vi-i]]).", "Refusal of the union also concerns the [[lambeth-constitution]] and the [[unchanged-ordinal]]. The dissenters are not a single political bloc: Scottish and French Reformed resistance coexists with minority refusals by German principalities and Dutch towns."], "facts": [["Centres", "Geneva, Edinburgh, Montauban, Nîmes"], ["Order", "Presbyterian"], ["Map colour", "HRF violet"]], "faith": [], "office": null, "rel": [["cranmerian", "Outside it by choice."], ["gallican-church", "Source of reconciled Huguenots."]], "color": "#4B3B7A", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Eucharist", "The presence is spiritual and given only to the believing receiver. The Lambeth formula's presence through consecration alone ([[lambeth-formula]]) seems to them to come too close to the Roman and Lutheran errors."], ["Predestination", "Double predestination in the Genevan sense, which later becomes the issue at Dort ([[synod-of-dort]])."], ["Worship", "Scripture alone regulates worship. Plain churches, no ceremonies without a command."]], "structure": ["Presbyterian: ministers, elders and deacons; consistory, presbytery, provincial and national assembly. No bishops. The Geneva Company of Pastors and the Scottish General Assembly are the model. The Communion's jointly ordained synodal bishops and retained Ordinal are additional points of dispute ([[lambeth-constitution]], [[unchanged-ordinal]])."], "theologians": ["calvin", "beza", "knox", "andrew-melville", "gomarus", "jeanne-d-albret"]}, {"id": "byzantinists", "t": "faith", "name": "Byzantinist Church Party", "st": "canon", "when": "1610s–1789", "y": 1630, "y2": null, "sum": "An Anglican party with Greek sympathies, rooted in the West Country, that wants an autocratic Christian monarchy and a church close to the Greeks.", "body": ["The Byzantinists are Anglicans who look to the Greek Fathers and to Constantinople. In the English struggle they form a third group beside the Reforming Crown and the Royalist establishment. Their political ideal is autocratic government on the model of the Roman and Byzantine empires, with a modernised army. A minority wants the West Country held as an armed stronghold and formal talks with Constantinople, or with Moscow and the Narva primate.", "After the war the Byzantinists emigrate. They found a colony in the Chesapeake, taking the place of Catholic Maryland, with clergy under the Bishop of London."], "facts": [["Strength", "Devon, Cornwall, Bristol, Exeter, Oxford’s Greek circle"], ["Colony", "St Mary’s City, Chesapeake (1634)"], ["Map colour", "BYZ"]], "faith": [], "office": null, "rel": [["cranmerian", "A party within the English church."], ["eastern-orthodox", "Sympathy and possible talks."]], "color": "#D9822B", "basis": null, "open_q": ["Whether the West Country stronghold becomes a formal Anglo-Orthodox jurisdiction."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Eucharist", "A high reading of the Lambeth formula: the presence through consecration ([[john-cosin]]), with an emphasis on epiclesis taken from the Greek liturgies."], ["Fathers and councils", "The Greek Fathers and the first seven councils as the standard. A hope for communion with Constantinople."], ["Monarchy", "An autocratic Christian emperor-king, on a Roman and Byzantine model. This is a political theology as much as a doctrinal one."]], "structure": ["An Anglican party, not a separate church, rooted in the West Country. Its bishops and clergy sit within the Communion's episcopal order, but a faction wants a stronghold in the West and direct talks with Constantinople."], "theologians": ["lancelot-andrewes", "john-cosin", "edward-pococke", "patrick-young", "thomas-roe"]}, {"id": "evangelical-unaligned", "t": "faith", "name": "Unaligned Evangelicals", "st": "canon", "when": "1525–1789", "y": 1525, "y2": null, "sum": "Evangelical churches of Courland and Livonia outside the German disputes.", "body": ["A small group on the Baltic edge, untouched by the Philippist–Gnesio quarrel. Prussia was caught up in Osiander’s controversy rather than in that split ([[osiander]]) and later becomes Gnesio-Catholic. Courland and Livonia stay unaligned."], "facts": [["Map colour", "EVG pink"]], "faith": [], "office": null, "rel": [], "color": "#D49AAE", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Justification", "Evangelical, by faith alone, but without commitment to either Wittenberg party. Prussia was caught up in Osiander's controversy ([[osiander]]) rather than in the Philippist–Gnesio split."]], "structure": ["Local church orders in Courland and Livonia under their dukes and city councils; no common hierarchy."], "theologians": ["osiander"]}, {"id": "unity-brethren", "t": "faith", "name": "Unity of the Brethren", "st": "canon", "when": "to 1789", "y": 1575, "y2": null, "sum": "The Bohemian Brethren, who join the Cranmerian communion.", "body": ["The Unity of the Brethren is a Bohemian church of the Hussite tradition. A Brethren minister, Jan Rokyta, debated Ivan IV in 1570. After the Bohemian union of 1575 the Brethren go to Cranmer, while the Utraquists go with the Gnesio-Catholics. [[comenius]] is their last great bishop."], "facts": [["Communion", "Cranmerian"], ["Map colour", "UNI"]], "faith": [], "office": null, "rel": [["cranmerian", "Joined after 1575."]], "color": "#C2603E", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Heritage", "The Hussite tradition of the Bohemian reformation, with a strong discipline and a practical ethic."], ["Eucharist", "Spiritual presence, close to the Lambeth formula ([[lambeth-formula]]), which eased their entry to the Communion."]], "structure": ["Bishops (seniors) and a synod; local congregations and strict discipline. After 1575 they join the Cranmerian communion ([[cranmerian]])."], "theologians": ["comenius", "jan-blahoslav", "jan-rokyta"]}, {"id": "unitarian", "t": "faith", "name": "Unitarian Church of Transylvania", "st": "canon", "when": "1568–1789", "y": 1568, "y2": null, "sum": "The Antitrinitarian church of Transylvania, one of the principality’s recognised religions.", "body": ["Under [[ferenc-david]] and with the backing of John Sigismund, the Edict of Torda ([[torda]], 1568) protects preaching. Transylvania recognises Roman, Cranmerian and Unitarian churches, with Gnesio-Catholics a possible fourth. Its Polish cousins are the [[polish-brethren]]."], "facts": [["Seat", "Kolozsvár"], ["Map colour", "UNT teal"]], "faith": [], "office": null, "rel": [], "color": "#2E9CA6", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Antitrinitarianism", "God is one person. Christ is divine in an office or by adoption, not co-equal in essence. Preaching is protected by the Edict of Torda ([[torda]])."], ["Worship", "Simple, centred on preaching. No adoration of Christ in the Dávid party."]], "structure": ["A superintendent (bishop) in Kolozsvár and congregational synods, recognised by the principality's Diet as one of its legitimate religions."], "theologians": ["ferenc-david", "giorgio-biandrata"]}, {"id": "polish-brethren", "t": "faith", "name": "Polish Brethren", "st": "canon", "when": "1565–1789", "y": 1565, "y2": null, "sum": "The antitrinitarian community of Poland-Lithuania.", "body": ["The Polish Brethren stand with the Unitarians of Transylvania as the radical edge of Polish toleration. [[faustus-socinus]] gives them their theology."], "facts": [["Map colour", "POL"]], "faith": [], "office": null, "rel": [], "color": "#2E9CA6", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Antitrinitarianism", "Socinian: Christ is a man raised to divinity, rationalist reading of Scripture."], ["Ethics", "Strong pacifism and refusal of public office in many congregations."]], "structure": ["Congregations and a synod, with Raków as the intellectual centre."], "theologians": ["faustus-socinus", "giorgio-biandrata"]}, {"id": "anabaptist", "t": "faith", "name": "Anabaptists and Mennonites", "st": "canon", "when": "1525–1789", "y": 1525, "y2": null, "sum": "Radical communities of peaceable believers, shown as dots rather than territories.", "body": ["With Zwingli dead at Marignano, the first Anabaptist circle around his students never forms in Zurich. Radical reformers such as Hubmaier at Waldshut and Müntzer at Mühlhausen still appear, since neither depended on Zwingli. [[menno-simons]] organises the Mennonites in the north, and Hutterite communities appear on the map."], "facts": [["Map colour", "ANA dots"]], "faith": [], "office": null, "rel": [], "color": "#3D3D3D", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Believer's baptism", "Baptism is for adults who confess. The church is a gathered community."], ["Separation", "Many refuse oaths and arms; Hutterites hold property in common ([[jakob-hutter]])."]], "structure": ["Local congregations with elders; no state church. The Mennonites ([[menno-simons]]) in the north and Hutterite communities in Moravia."], "theologians": ["menno-simons", "balthasar-hubmaier", "thomas-muntzer", "jakob-hutter"]}, {"id": "eastern-orthodox", "t": "faith", "name": "Eastern Orthodox Churches", "st": "canon", "when": "to 1789", "y": 1500, "y2": null, "sum": "The Patriarchates of Constantinople, Peć and Ohrid, plus Kiev’s Orthodox, Georgia and the Eastern patriarchs.", "body": ["The Orthodox of the Ottoman Empire, Venice and Lithuania look to Constantinople ([[cyril-lucaris]] in 1635), with the Serbian Patriarchate of Peć restored in 1557 and the Archbishopric of Ohrid self-governing. Moscow’s church has been self-governing since 1448 and a patriarchate since 1589, but under Filaret’s catechism it parts doctrinally from the Greeks ([[russian-orthodox]]).", "Kiev’s Orthodox, inside Poland-Lithuania, become the bastion of resistance to that catechism under [[peter-mohyla]]. The Greek patriarchs condemn the Russian formulas without breaking communion. The model is the real Lucaris affair, where a Calvin-leaning confession of 1629 was condemned by Greek synods up to Jerusalem in 1672."], "facts": [["Heads", "Constantinople, Peć, Ohrid, Kiev (Orthodox metropolitan)"], ["Map colour", "ORT blue"]], "faith": [], "office": null, "rel": [["russian-orthodox", "Strained communion over the catechism."], ["ruthenian-uniate", "Split Kiev’s church at Brest."]], "color": "#6E9BC9", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Theosis and the Fathers", "The first seven councils, the Greek Fathers, the liturgy as the centre of faith."], ["The catechism question", "The Greek and Kievan churches reject Filaret's catechism ([[filaret-catechism]]) with its penal substitution and dual imputation. Lucaris' Calvinising confession was condemned in history, and the same question now falls on Moscow's text."]], "structure": ["Patriarchates (Constantinople, Alexandria, Antioch, Jerusalem), the Serbian Patriarchate of Peć and the self-governing Archbishopric of Ohrid. Kiev's metropolitan holds a seat in Poland-Lithuania, alongside the Uniate rival ([[ruthenian-uniate]])."], "theologians": ["dositheos-of-jerusalem", "cyril-lucaris", "peter-mohyla", "maximus-the-greek", "nil-sorsky", "joseph-volotsky"]}, {"id": "russian-orthodox", "t": "faith", "name": "Russian Orthodox Church", "st": "canon", "when": "1448–1789", "y": 1627, "y2": null, "sum": "The Church of Moscow, which in 1627 adopts Filaret’s catechism: Gnesio terminology, penal substitution, dual imputation.", "body": ["After the Polish occupation of Moscow in 1610–12, Patriarch [[filaret]] answers Roman and Polish pressure with the catechism of 1627 ([[filaret-catechism]]). It teaches the material sufficiency of Scripture, treats the deuterocanon as Second Temple apostolic tradition rather than Scripture proper, and holds penal substitution and dual imputation: sin imputed to Christ, his righteousness to the believer. It is an indigenous synthesis of Byzantine ecclesiology and Augustinian-Lutheran soteriology rather than a borrowed Western scholasticism.", "Dual imputation is allowed. Teaching that concupiscence is formally sinful is not. The catechism has to say how substitution fits the Orthodox language of union with God, and the answer produces new factions inside the church.", "Kiev-trained clergy resist. After Pereiaslav ([[pereiaslav]], 1654) Moscow absorbs its main critics, and a compromise revision around 1685 brings a small break. The Western-Rite church ([[western-rite-orthodox]]) stays loyal to Moscow."], "facts": [["Head", "Patriarch of Moscow (Joasaph I in 1635)"], ["Catechism", "1627; revised c.1685"], ["Authority", "Scripture materially sufficient; the deuterocanon as apostolic tradition"], ["Soteriology", "Penal substitution; dual imputation; concupiscence not formally sinful"], ["Map colour", "ORC"]], "faith": [], "office": null, "rel": [["eastern-orthodox", "Greek patriarchs condemn the formulas without breaking communion."], ["western-rite-orthodox", "In communion; its mirror in the west."]], "color": "#3F6FA6", "basis": null, "open_q": ["Which factions the dual-imputation question creates inside Russian Orthodoxy.", "The size and character of the 1685 break."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["The catechism of 1627", "Filaret's catechism ([[filaret-catechism]]): material sufficiency of Scripture, the deuterocanon as Second Temple apostolic tradition, penal substitution and dual imputation."], ["The Kiev resisters", "Kievan scholars object to the catechism ([[kiev-resisters]]). After Pereiaslav ([[pereiaslav]]) they are absorbed in Moscow and bring their own scholastic learning."], ["Ritual", "The Stoglav ([[stoglav]]) rules on ritual and discipline; the church holds that Moscow is the heir of the Greek tradition."]], "structure": ["A patriarchate since 1589 ([[job]]). The patriarch is first among bishops but works alongside the tsar. The Western-Rite church ([[western-rite-orthodox]]) is a vicariate."], "theologians": ["filaret", "lavrentiy-zizanius", "simeon-polotsky", "feofan-prokopovich", "maximus-the-greek", "nil-sorsky", "joseph-volotsky", "hermogenes"]}, {"id": "western-rite-orthodox", "t": "faith", "name": "Western-Rite Orthodox Church", "st": "canon", "when": "1570s–1789", "y": 1589, "y2": null, "sum": "A church with a Western liturgy and Orthodox bishops and creed, in communion with Moscow, with its primate at Narva.", "body": ["It begins with Ivan IV’s experiment in the 1570s, after the 1570 debate with the Brethren minister Jan Rokyta. Deported people of Dorpat are settled in Russia and given a charter. It becomes a vicariate under the new Patriarchate in 1589, and Godunov’s Westernising policy turns it into a church with its own primate around 1600.", "The price of Orthodox recognition is steep. The filioque and unleavened bread are given up. Converts are received by chrismation. The primate is a monk. Clergy are ordained by Orthodox bishops. It is the mirror image of Brest, a Western rite inside Orthodoxy beside the Eastern rite inside Rome.", "It stays loyal in 1612. At Stolbovo (1617) Sweden takes Narva and treaty-protects the primate, so an Orthodox see survives inside Gnesio-Catholic Sweden. It keeps vicariates in Moscow’s German Quarter, Novgorod and Pskov."], "facts": [["Seat", "Narva"], ["Communion", "Moscow"], ["Reception", "Chrismation"], ["Map colour", "WRO"]], "faith": [], "office": null, "rel": [["gnesio-orthodox", "The same community, seen as a Gnesio branch."], ["russian-orthodox", "In communion."]], "color": "#2F5C8A", "basis": null, "open_q": ["Who holds the primacy between about 1600 and Matthiae's appointment."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Orthodox creed", "The Nicene creed without the filioque, and leavened bread, given up as the price of recognition."], ["Western liturgy", "A Latin or vernacular Western liturgy retained, with a theology close to Gnesio justification ([[gnesio-orthodox]])."]], "structure": ["Primate at Narva, in 1635 Johannes Matthiae ([[johannes-matthiae]]), under the Patriarch of Moscow as a vicariate and protected by treaty inside Gnesio-Catholic Sweden."], "theologians": ["johannes-matthiae", "jan-rokyta", "andrey-kurbsky"]}, {"id": "ruthenian-uniate", "t": "faith", "name": "Ruthenian Uniate Church", "st": "canon", "when": "1596–1789", "y": 1596, "y2": null, "sum": "The Eastern-rite church of Belarus and Ukraine, united with Rome at Brest.", "body": ["The bishops accept union in 1596 ([[brest]]) but many parishes, the Lviv brotherhood and the Ostroh circle do not. The Uniate Metropolitan [[josyf-rutsky]] holds Kiev alongside the Orthodox Metropolitan [[peter-mohyla]], so the same city has two churches."], "facts": [["Head", "Uniate Metropolitan of Kiev"], ["Communion", "Roman"], ["Map colour", "ECA"]], "faith": [], "office": null, "rel": [["eastern-orthodox", "Rival church in the same cities."], ["roman-catholic", "In union."]], "color": "#A9B98A", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Union with Rome", "Papal primacy accepted, the filioque tolerated in the Roman creed. The Eastern rite, married clergy and the Byzantine liturgy are kept ([[brest]])."]], "structure": ["The Uniate Metropolitan of Kiev ([[josyf-rutsky]]) and bishops, in communion with Rome. Orthodox parishes and brotherhoods stay outside."], "theologians": ["hypatius-pociej", "josyf-rutsky", "josaphat-kuntsevych"]}, {"id": "sunni", "t": "faith", "name": "Sunni Islam", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The majority tradition of the Ottoman, Moroccan and North African worlds.", "body": ["Ottoman rule over the Mamluk lands (1517) and Suleiman’s legal order under Şeyhülislam Ebussuud ([[ebussuud]]) make this the dominant faith of the eastern Mediterranean. In the west, the Saadian sultans of Morocco conquer Songhai in 1591. Muslims remain in Spain only until the expulsion of the Moriscos (1609–14)."], "facts": [["Map colour", "SUN green"]], "faith": [], "office": null, "rel": [], "color": "#5E9E6E", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Law", "Hanafi in the Ottoman lands, Maliki in North Africa. Suleiman's qanun and the sharia are joined under the Şeyhülislam ([[ebussuud]])."], ["Revival", "Reformers such as Birgivi ([[birgivi]]) demand strict adherence."]], "structure": ["The Ottoman sultan holds the caliphal claim from 1517 ([[ridaniya]]). Ulema, muftis and the Şeyhülislam. Morocco has its own sultanate."], "theologians": ["ebussuud", "birgivi"]}, {"id": "shia", "t": "faith", "name": "Shia Islam", "st": "hist", "when": "to 1789", "y": 1501, "y2": null, "sum": "Twelver Shia under the Safavids, and Zaydi Shia in northern Yemen.", "body": ["Shah Ismail makes Twelver Shia the state faith in 1501. The Safavids retake Baghdad in 1623 and hold it until 1638. Zaydi imams hold the northern highlands of Yemen."], "facts": [["Map colour", "SHI dark green"]], "faith": [], "office": null, "rel": [], "color": "#2F6E4E", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Twelver doctrine", "Twelve imams, the hidden imam, state-sponsored mourning rites."], ["Philosophy", "The Isfahan school: Mulla Sadra's transcendent theosophy ([[mulla-sadra]]) and Baha al-Din al-Amili ([[shaykh-bahai]])."]], "structure": ["Safavid shahs and Persian ulema, with Arab Jabal Amil scholars invited by Tahmasp ([[al-karaki]]). Zaydi imams govern the Yemen highlands ([[al-mansur-al-qasim]])."], "theologians": ["al-karaki", "shaykh-bahai", "mulla-sadra", "al-mansur-al-qasim"]}, {"id": "ibadi", "t": "faith", "name": "Ibadi Islam", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The Ibadi community of Oman and a few North African oases.", "body": ["Oman’s Ibadi imamate is shown on the map with Hormuz."], "facts": [["Map colour", "IBA light green"]], "faith": [], "office": null, "rel": [], "color": "#A6CC86", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Imamate", "An elected imam, a distinct and moderate Ibadi theology."]], "structure": ["Oman's imamate, with a tribal consultative council."], "theologians": ["nasir-bin-murshid"]}, {"id": "judaism", "t": "faith", "name": "Jewish Communities", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "Jewish communities from Prague and Kraków to Safed, Salonica and Rome, shown as dots on the confession map.", "body": ["The great centres are Prague, Kraków, Lwów, Venice, Constantinople, Salonica and Safed. In Poland-Lithuania, the Council of Four Lands governs communal life from the 1580s. [[joseph-karo]] codifies law at Safed. Karaite communities appear in the same dots."], "facts": [["Map colour", "JEW dots"]], "faith": [], "office": null, "rel": [], "color": "#7A4FA3", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Halakha", "Karo's Shulchan Aruch with Isserles' glosses ([[joseph-karo]], [[moses-isserles]]) become the common code."], ["Kabbalah", "Safed's mystics, Luria in particular ([[isaac-luria]])."]], "structure": ["Local kehillot and rabbinic courts. The Council of Four Lands governs Polish and Lithuanian Jews from the 1580s. Joseph Nasi ([[joseph-nasi]]) is a patron in the Ottoman world."], "theologians": ["joseph-karo", "moses-isserles", "isaac-luria", "maharal", "joseph-nasi"]}, {"id": "miaphysite", "t": "faith", "name": "Miaphysite Churches", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The Coptic, Ethiopian, Armenian and Syriac churches.", "body": ["The Coptic Patriarchate of Alexandria and the Ethiopian Church share a jurisdiction on the map. The Armenian Catholicos sits at Etchmiadzin and Cilicia’s at Sis. The Syriac Patriarch is at Mardin. Ethiopia’s emperor Susenyos converts to Rome in 1622 and abdicates in 1632 ([[susenyos]])."], "facts": [["Map colour", "MIA"]], "faith": [], "office": null, "rel": [], "color": "#8E6FB0", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Christology", "One incarnate nature of the divine Word, the Cyrilline formula. The Armenian Church accepts at Jerusalem in 1672 that Chalcedon's two natures are not Nestorian, and the Greeks accept the formula as orthodox ([[synod-of-jerusalem-1672]]). The Copts and Syriacs keep the older position."]], "structure": ["Separate patriarchates: Alexandria, Etchmiadzin, Sis, Mardin, and the Ethiopian metropolitan. Emperor Susenyos' conversion to Rome in 1622 splits Ethiopia ([[susenyos]])."], "theologians": ["hakob-iv-julfa", "voskan-yerevantsi"]}, {"id": "church-east", "t": "faith", "name": "Church of the East", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The East Syriac church of northern Iraq, with its patriarch at Rabban Hormizd.", "body": ["Shown as a community dot on the map."], "facts": [["Map colour", "COE"]], "faith": [], "office": null, "rel": [], "color": "#4B6584", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Christology", "The East Syriac tradition, outside the Chalcedonian and the Miaphysite camps."]], "structure": ["A patriarch at Rabban Hormizd, with metropolitans in northern Iraq."], "theologians": []}, {"id": "maronite", "t": "faith", "name": "Maronite Church", "st": "canon", "when": "to 1789", "y": 1500, "y2": null, "sum": "The Maronites of Lebanon, in communion with Rome.", "body": ["Corrected in the map project: the Maronites are marked in communion with Rome, not as Miaphysite."], "facts": [["Seat", "Qannubin"], ["Communion", "Roman"]], "faith": [], "office": null, "rel": [], "color": "#E3C25B", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Roman communion", "In communion with Rome, with a Syriac liturgy."]], "structure": ["A patriarch in Mount Lebanon, under Ottoman rule."], "theologians": []}, {"id": "traditional-religions", "t": "faith", "name": "Traditional Religions", "st": "hist", "when": "to 1789", "y": 1500, "y2": null, "sum": "The religions of sub-Saharan Africa, the Americas and the Eurasian steppe.", "body": ["Mapped as a single category outside the Christian and Islamic jurisdictions, with Christian and Muslim communities shown as dots where they exist."], "facts": [["Map colour", "TRA tan"]], "faith": [], "office": null, "rel": [], "color": "#C9B79C", "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [["Diverse practice", "Ancestral religion, shamanism and local cults, mapped as one category."]], "structure": ["Local authorities: lineage elders, chiefs, shamans. Missionary Christian and Muslim communities appear as dots on the map."], "theologians": []}, {"id": "julius-ii", "t": "person", "name": "Julius II", "st": "hist", "when": "pope 1503–13", "y": 1503, "y2": 1513, "sum": "The pope who convened Lateran V in 1512.", "body": ["Julius II opens the Fifth Lateran Council in 1512 and holds the Papal States together by war. The timeline’s reform agenda starts under him, before any evangelical movement exists."], "facts": [], "faith": ["roman-catholic"], "office": "Pope", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Pope Julius II", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "leo-x", "t": "person", "name": "Leo X", "st": "hist", "when": "pope 1513–21", "y": 1513, "y2": 1521, "sum": "Medici pope who closes Lateran V and signs the Bologna concordat with France.", "body": ["Leo X closes the Lateran Council in 1517 and concludes the [[concordat-of-bologna]] with Francis I in 1516. His court is the target of every later complaint about curial abuses."], "facts": [], "faith": ["roman-catholic"], "office": "Pope", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Pope Leo X", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "paul-iii", "t": "person", "name": "Paul III", "st": "hist", "when": "pope 1534–49", "y": 1534, "y2": 1549, "sum": "The pope under whom Trent opens, and under whom the softened Session 6 passes.", "body": ["Paul III summons the Council of Trent, which opens in 1545. In this timeline its Session 6 in 1547 allows imputed righteousness, and the council is suspended in 1549. He is the last pope in the project’s canon before Urban VIII."], "facts": [], "faith": ["roman-catholic"], "office": "Pope", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Pope Paul III", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "urban-viii", "t": "person", "name": "Urban VIII", "st": "canon", "when": "pope 1623–44", "y": 1623, "y2": 1644, "sum": "The pope in 1635, shown on the map at Rome.", "body": ["Urban VIII sits at Rome while France leads the war against the Habsburgs and Bohemia is returned to Rome in its Utraquist rite. He is the holder of the pope seat on the 1635 map."], "facts": [], "faith": ["roman-catholic"], "office": "Pope", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Pope Urban VIII", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "reginald-pole", "t": "person", "name": "Reginald Pole", "st": "prop", "when": "1500–58", "y": 1545, "y2": null, "sum": "English cardinal and papal legate, proposed as an architect of the softened Session 6.", "body": ["Pole was one of the legates at Trent's opening and belonged to the Spirituali ([[spirituali]]). In this timeline he is proposed as a driving voice for imputed righteousness in 1547, a role history did not give him. Under Mary he is Archbishop of Canterbury from Cranmer's death in 1556 until his own in 1558, as in history ([[mary-i-england]])."], "facts": [], "faith": ["roman-catholic"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Reginald Pole", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "giovanni-morone", "t": "person", "name": "Giovanni Morone", "st": "prop", "when": "1509–80", "y": 1547, "y2": null, "sum": "Cardinal of the Spirituali, proposed as Pole’s ally in 1547.", "body": ["Morone was a diplomat of the reforming wing and was later suspected of heresy by the hardliners. Here he is proposed as a negotiator who carries the Session 6 compromise through the council."], "facts": [], "faith": ["roman-catholic"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Giovanni Morone", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gasparo-contarini", "t": "person", "name": "Gasparo Contarini", "st": "hist", "when": "1483–1542", "y": 1541, "y2": null, "sum": "Venetian cardinal and head of the Spirituali, whose Regensburg formula on justification anticipates Session 6.", "body": ["Contarini negotiated the formula on double justification at Regensburg in 1541 and died the next year. His text is the model for the compromise that the council adopts in 1547 in this timeline, though he does not live to see it."], "facts": [], "faith": ["roman-catholic"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Gasparo Contarini", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "cajetan", "t": "person", "name": "Thomas de Vio, Cardinal Cajetan", "st": "hist", "when": "1469–1534", "y": 1518, "y2": null, "sum": "Dominican theologian and legate to Germany.", "body": ["Cajetan was the senior Thomist of the age and Rome’s legate at Augsburg in 1518. His death in 1534 predates the council. The Thomist rigour he stands for is the main resistance to the Session 6 compromise."], "facts": [], "faith": ["roman-catholic"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Thomas Cajetan", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "pierre-d-epinac", "t": "person", "name": "Pierre d’Épinac", "st": "canon", "when": "Archbishop of Lyon 1574–99", "y": 1574, "y2": 1599, "sum": "First effective Primate of Lyon.", "body": ["D’Épinac gives the Lyon primacy real content: appeals from the French sees, the right to convene the national synod, and a first claim on the Rhineland. He works with the king against the Guise family’s ambitions in the church."], "facts": [], "faith": ["gallican-church"], "office": "Primate of Lyon", "rel": [], "color": null, "basis": "Real person. First effective Primate here; the role is canon, the precise acts are proposed.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Pierre d'Épinac", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "alphonse-de-richelieu", "t": "person", "name": "Alphonse de Richelieu", "st": "canon", "when": "Archbishop of Lyon 1628–53", "y": 1628, "y2": 1653, "sum": "Cardinal and Primate of the Gauls in 1635, brother of the king’s minister.", "body": ["Alphonse de Richelieu is Primate when France leads the war against the Habsburgs as protector of the Lyon-aligned churches. His brother runs royal policy, and the office gains weight across the Rhine."], "facts": [], "faith": ["gallican-church", "gnesio-lyon"], "office": "Primate of Lyon", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Alphonse-Louis du Plessis de Richelieu", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "tournon", "t": "person", "name": "Cardinal François de Tournon", "st": "hist", "when": "1489–1562", "y": 1561, "y2": null, "sum": "Senior cardinal at Poissy, who opposed Beza.", "body": ["Tournon presided over the Roman side at Poissy and resisted the Reformed speakers. The fact that Poissy partly succeeds in this timeline needs an explanation, and his death in 1562 is one of the hinges."], "facts": [], "faith": ["gallican-church"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person.", "open_q": ["What explains Poissy’s success despite Tournon’s opposition."], "branch_of": null, "role": "leader", "wiki": "François de Tournon", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "cardinal-of-lorraine", "t": "person", "name": "Charles, Cardinal of Lorraine", "st": "hist", "when": "1524–74", "y": 1561, "y2": null, "sum": "Guise archbishop of Reims, rival for primatial authority.", "body": ["Charles of Lorraine held Reims with its own primatial claims and represented the Guise party in the church. The king’s support for Lyon is meant partly as a counterweight to him."], "facts": [], "faith": ["gallican-church"], "office": "Cardinal", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "statesman", "wiki": "Charles, Cardinal of Lorraine", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "baius", "t": "person", "name": "Michael Baius", "st": "hist", "when": "1513–89", "y": 1567, "y2": null, "sum": "Louvain theologian whose Augustinian teaching Rome censures only lightly.", "body": ["Baius taught that fallen nature cannot do good without grace and that concupiscence is sinful. Here Rome censures him lightly and Louvain and Ghent remain Baianist strongholds."], "facts": [], "faith": ["roman-catholic", "gallican-church"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Michael Baius", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "jansen", "t": "person", "name": "Cornelius Jansen", "st": "prop", "when": "1585–1638", "y": 1636, "y2": null, "sum": "Louvain Augustinian and bishop of Ypres, proposed as the school’s next great voice.", "body": ["Jansen’s Augustinus appeared after his death in 1640 in our history. He is proposed here as a Baianist successor writing for a Roman communion that has never closed the Augustinian question."], "facts": [], "faith": ["roman-catholic"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Cornelius Jansen", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "flacius", "t": "person", "name": "Matthias Flacius Illyricus", "st": "canon", "when": "1520–75", "y": 1550, "y2": null, "sum": "Leader of the Gnesio-Lutherans and printer of the case against the Interims from besieged Magdeburg.", "body": ["Flacius rejects the Augsburg and Leipzig Interims and prints the case from Magdeburg. His line of teaching becomes the Gnesio-Catholic church’s inheritance. He dies the same year as the Bohemian union that fixes the church’s name."], "facts": [], "faith": ["gnesio-catholic"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Matthias Flacius", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "amsdorf", "t": "person", "name": "Nikolaus von Amsdorf", "st": "hist", "when": "1483–1565", "y": 1548, "y2": null, "sum": "Luther’s ally and the first evangelical bishop of Naumburg, Gnesio leader.", "body": ["Amsdorf holds that the Interims betray the Reformation and is the senior churchman of Ernestine Thuringia. His consecration in 1542 is the kind of episcopal precedent the Gnesio-Catholics later invoke."], "facts": [], "faith": ["gnesio-catholic"], "office": "Bishop", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Nikolaus von Amsdorf", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "john-frederick-i", "t": "monarch", "name": "John Frederick I of Saxony", "st": "hist", "when": "1503–54", "y": 1547, "y2": null, "sum": "Elector who loses his title at Mühlberg and leaves the Ernestines in Thuringia.", "body": ["Captured at [[muhlberg]], John Frederick loses the electorate to Maurice. His heirs keep the Thuringian lands, the future Gnesio heartland."], "facts": [], "faith": ["gnesio-catholic"], "office": "Prince", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": null, "wiki": "John Frederick I, Elector of Saxony", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "john-william-saxe-weimar", "t": "monarch", "name": "John William of Saxe-Weimar", "st": "hist", "when": "1530–73", "y": 1567, "y2": null, "sum": "Ernestine duke whose line is broken by the Grumbach Feud.", "body": ["His territory is split after [[grumbach-feud]], with Weimar and Jena staying Gnesio-Catholic and Gotha and Coburg becoming Philippist. The averted purge of Jena by Elector August in 1573 is a point the timeline must handle."], "facts": [], "faith": ["gnesio-independent"], "office": "Prince", "rel": [], "color": null, "basis": "Real person.", "open_q": ["How Elector August’s 1573 purge of Jena is averted."], "branch_of": null, "role": null, "wiki": "John William, Duke of Saxe-Weimar", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "john-iii-sweden", "t": "monarch", "name": "John III of Sweden", "st": "hist", "when": "1537–92", "y": 1576, "y2": 1592, "sum": "King whose Red Book of 1576 starts Sweden’s road to Gnesio-Catholicism.", "body": ["John III’s liturgy, the Red Book ([[red-book]]), leans toward the ancient church. Sweden’s [[uppsala-synod]] of 1593 completes the work after his death."], "facts": [], "faith": ["gnesio-independent"], "office": "King", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": null, "wiki": "John III of Sweden", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "abraham-angermannus", "t": "person", "name": "Abraham Angermannus", "st": "hist", "when": "c.1540–99", "y": 1593, "y2": 1599, "sum": "Archbishop of Uppsala who presides at the 1593 synod.", "body": ["Angermannus leads the church that adopts the Uppsala settlement. Under his archbishopric the Swedish succession is secured for later Gnesio consecrations."], "facts": [], "faith": ["gnesio-independent"], "office": "Archbishop of Uppsala", "rel": [], "color": null, "basis": "Real person. His role at 1593 is historical.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Abraham Angermannus", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "albert-of-prussia", "t": "monarch", "name": "Albert of Prussia", "st": "hist", "when": "1490–1568", "y": 1525, "y2": null, "sum": "Last Grand Master and first Duke of Prussia, a Polish fief.", "body": ["Albert secularises the Teutonic state in 1525 and founds Königsberg’s university. His church is caught up in [[osiander]]’s controversy, then becomes Gnesio-Catholic under Polish overlordship."], "facts": [], "faith": ["evangelical-unaligned", "gnesio-independent"], "office": "Prince", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": null, "wiki": "Albert, Duke of Prussia", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "osiander", "t": "person", "name": "Andreas Osiander", "st": "hist", "when": "1498–1552", "y": 1550, "y2": null, "sum": "Königsberg theologian whose dispute on justification divides Prussia.", "body": ["The Osiandrian controversy is Prussia’s own quarrel, separate from the Philippist–Gnesio split. It keeps the duchy off the German map of parties."], "facts": [], "faith": ["evangelical-unaligned"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Andreas Osiander", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "wolfgang-wilhelm", "t": "monarch", "name": "Wolfgang Wilhelm of Palatinate-Neuburg", "st": "canon", "when": "1578–1653", "y": 1613, "y2": null, "sum": "Prince who turns Gnesio-Catholic in 1613 to win French backing for Jülich.", "body": ["Historically he converted to Rome to win Spanish support. Here he converts to the Gnesio-Catholic church under Lyon, takes Jülich and Berg at [[xanten]], and brings the Rhine under the Lyon orbit."], "facts": [], "faith": ["gnesio-lyon"], "office": "Prince", "rel": [], "color": null, "basis": "Real person. The conversion is the timeline’s parallel to the historical one.", "open_q": [], "branch_of": null, "role": null, "wiki": "Wolfgang Wilhelm, Count Palatine of Neuburg", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "cranmer", "t": "person", "name": "Thomas Cranmer", "st": "canon", "when": "1489–1556", "y": 1549, "y2": 1556, "sum": "Archbishop of Canterbury and convener of the international council at Lambeth.", "body": ["Cranmer's council sits at Lambeth from 1549, with the continental exiles in England ([[lambeth-council]]). His Communion is named for him. He is burned at Oxford in March 1556 under Mary ([[mary-i-england]]), having recanted and then withdrawn the recantation, as in history. His martyrdom is the Communion's founding story in England.", "His settlement includes the [[lambeth-constitution]] and the [[unchanged-ordinal]]. He rejects the Roman theology of the Mass but retains the inherited ordination rite for propaganda against Roman opponents. He also moderates royal supremacy toward a humanist account of Christian government, drawing on late Roman conceptions of Church and emperor and the political tradition exemplified by Dante’s De Monarchia. This is a development within royal supremacy, not a restoration of papal jurisdiction."], "facts": [], "faith": ["cranmerian"], "office": "Archbishop of Canterbury", "rel": [], "color": null, "basis": "Real person. His later fate is open.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Thomas Cranmer", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "melanchthon", "t": "person", "name": "Philip Melanchthon", "st": "hist", "when": "1497–1560", "y": 1548, "y2": null, "sum": "Philippist leader whose Leipzig Interim keeps doctrine and yields on ceremonies.", "body": ["Melanchthon’s compromise at Leipzig is the origin of the Philippist party and of the name Cranmerian–Philippist Communion. His wing wins the contest with the Gnesio party."], "facts": [], "faith": ["cranmerian"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Philip Melanchthon", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "bucer", "t": "person", "name": "Martin Bucer", "st": "hist", "when": "1491–1551", "y": 1549, "y2": null, "sum": "Strasbourg reformer, exile in England and mediating voice at Lambeth.", "body": ["Bucer’s mediating theology on the Eucharist suits the Communion’s breadth. He dies at Cambridge in 1551, before the council ends."], "facts": [], "faith": ["cranmerian"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Martin Bucer", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "a-lasco", "t": "person", "name": "Jan Łaski (John à Lasco)", "st": "hist", "when": "1499–1560", "y": 1550, "y2": null, "sum": "Polish reformer, superintendent of the stranger churches in London.", "body": ["Łaski links England, Poland and the Low Countries. The Poles’ later entry into the Communion at [[consensus-of-sandomierz]] follows his line."], "facts": [], "faith": ["cranmerian"], "office": "Superintendent", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Jan Łaski", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "vermigli", "t": "person", "name": "Peter Martyr Vermigli", "st": "hist", "when": "1499–1562", "y": 1550, "y2": null, "sum": "Italian exile at Oxford, theologian of the Lambeth council.", "body": ["Vermigli teaches at Oxford and helps draft the Communion’s confession. He is the Italian voice in a council of exiles."], "facts": [], "faith": ["cranmerian"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Peter Martyr Vermigli", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "hemmingsen", "t": "person", "name": "Niels Hemmingsen", "st": "canon", "when": "1513–1600", "y": 1575, "y2": null, "sum": "Danish theologian never removed from his chair, so Denmark-Norway joins the Communion.", "body": ["Hemmingsen’s teaching puts Denmark-Norway in the Cranmerian–Philippist camp rather than the Gnesio. His survival as a leading voice is the reason for the Scandinavian split between Denmark and Sweden."], "facts": [], "faith": ["cranmerian"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Niels Hemmingsen", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "bullinger", "t": "person", "name": "Heinrich Bullinger", "st": "canon", "when": "1504–75", "y": 1550, "y2": null, "sum": "Zurich’s leader after Leo Jud, a moderate whose Second Helvetic Confession brings in the Hungarian Reformed.", "body": ["Bullinger succeeds [[leo-jud]] in a Zurich reformed through the [[zurich-settlement]]. With no Zwingli-led Reformation or historical Kappel catastrophe, his authority rests on the council settlement and on links with Basel, Strasbourg and the German evangelicals.", "His envoys participate in [[lambeth-council]]. Zurich’s acceptance links Swiss reform to the wider Communion, while the Second Helvetic Confession later supplies a route for the Hungarian Reformed. His moderation does not erase disputes about consecration, ministry or synodal government."], "facts": [], "faith": ["cranmerian"], "office": "Antistes of Zurich", "rel": [], "color": null, "basis": "Real person. His moderate role is canon.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Heinrich Bullinger", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "leo-jud", "t": "person", "name": "Leo Jud", "st": "canon", "when": "1482–1542", "y": 1530, "y2": null, "sum": "Zwingli’s friend who leads Zurich’s late, moderate reform.", "body": ["After Zwingli’s death at [[marignano]], Jud leads Zurich’s delayed Reformation. A brief internal crisis ends in the [[zurich-settlement]], which establishes municipal reform while accommodating the Catholic cantons. He works within the Swiss and Upper German networks of preaching and correspondence rather than inheriting Zwingli’s historical movement.", "His moderate church gives [[bullinger]] an institutional foundation after his death in 1542. Its later openness to Lambeth develops from this negotiated beginning."], "facts": [], "faith": ["cranmerian"], "office": "Pastor", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Leo Jud", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "brenz", "t": "person", "name": "Johannes Brenz", "st": "hist", "when": "1499–1570", "y": 1548, "y2": null, "sum": "Württemberg’s reformer, who resisted the Interim and shapes the Communion’s Lutheran right wing.", "body": ["Brenz hid from Spanish garrisons in 1548. His Württemberg ends up the Communion’s Lutheran right wing, with a teaching on the bodily presence that sits uneasily beside Reformed-leaning churches."], "facts": [], "faith": ["cranmerian"], "office": "Teacher", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "theologian", "wiki": "Johannes Brenz", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "frederick-v", "t": "person", "name": "Frederick V, Elector Palatine", "st": "canon", "when": "1596–1632", "y": 1619, "y2": 1632, "sum": "Cranmerian prince elected king of Bohemia in 1619.", "body": ["Elected as a Cranmerian king for a Gnesio-Catholic kingdom, he loses both crowns and the Palatinate to Bavaria after [[white-mountain]]. He dies in 1632. The Lower Palatinate is occupied in 1635."], "facts": [], "faith": ["cranmerian"], "office": "Prince", "rel": [], "color": null, "basis": "Real person.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Frederick V, Elector Palatine", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "laud", "t": "person", "name": "William Laud", "st": "prop", "when": "1573–1645", "y": 1633, "y2": null, "sum": "Bishop of London, chief of the Royalist establishment, who opposes the king.", "body": ["In history Laud was Archbishop of Canterbury from 1633 and was executed in 1645. Here the king favours a low-church settlement and Canterbury is left vacant after Abbot's death in 1633, a symptom of the quarrel. Laud, as Bishop of London, is the establishment's leader in everything but title."], "facts": [], "faith": ["cranmerian"], "office": "Archbishop of Canterbury", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "William Laud", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "comenius", "t": "person", "name": "Jan Amos Comenius", "st": "prop", "when": "1592–1670", "y": 1632, "y2": null, "sum": "Bishop of the Unity of the Brethren, a teacher in exile after the defeat of Bohemia.", "body": ["Comenius is the last bishop of the Unity in our history and a pedagogue with a European reputation. In this timeline the Brethren belong to the Cranmerian Communion, and he is the obvious voi
