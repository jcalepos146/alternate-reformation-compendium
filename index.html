iae was only eight in 1600."], "branch_of": null, "role": "leader", "wiki": "Johannes Matthiae", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "dositheos-of-jerusalem", "t": "person", "name": "Dositheos II of Jerusalem", "st": "hist", "when": "1641–1707", "y": 1672, "y2": 1707, "sum": "Patriarch of Jerusalem, who presided over the Synod of Jerusalem in 1672.", "body": ["In history Dositheos' synod condemned the Calvinising confession attributed to Lucaris. Here the same synod widens its work to the Russian catechism and to an agreement with a miaphysite church ([[synod-of-jerusalem-1672]])."], "facts": [], "faith": ["eastern-orthodox"], "office": "Patriarch of Jerusalem", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Dositheos II of Jerusalem", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "gallican-catechism", "t": "doc", "name": "Catechism of the Gallican Church", "st": "canon", "when": "1690s", "y": 1695, "y2": null, "sum": "Bossuet's catechism, which says the conciliarist canons of Constance and Basel are authoritative because of the pope.", "body": ["Written late in Bossuet's life ([[bossuet]]), the catechism teaches the Gallican liberties from a higher view of the papacy than the articles of 1682 ([[gallican-articles-1682]]). Its disputed line is that the canons of Constance and Basel bind because the pope confirms them. Conciliarists object that this makes the pope the source of conciliar authority. The Curia objects that it concedes a conciliar principle at all. The Gallican Church receives the catechism, and its trend toward papal confirmation outlasts him."], "facts": [["Date", "1690s"], ["Kind", "Catechism"], ["Parties", "Bossuet and the French clergy"], ["Effect", "Gallican theology moves toward papal confirmation of councils"]], "faith": ["gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "hakob-iv-julfa", "t": "person", "name": "Hakob IV of Julfa", "st": "prop", "when": "d. 1680", "y": 1672, "y2": 1680, "sum": "Catholicos of All Armenians at Etchmiadzin 1655–80.", "body": ["In history Hakob IV was Catholicos from 1655 and encouraged Armenian printing. Here he signs the agreement with the Greek patriarchates at the Synod of Jerusalem in 1672 ([[synod-of-jerusalem-1672]]), a role history did not give him."], "facts": [], "faith": ["miaphysite"], "office": "Catholicos of Etchmiadzin", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": [], "branch_of": null, "role": "leader", "wiki": "Hakob IV of Julfa", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "voskan-yerevantsi", "t": "person", "name": "Voskan Yerevantsi", "st": "hist", "when": "1614–74", "y": 1666, "y2": 1674, "sum": "Armenian bishop and printer who published the first printed Armenian Bible at Amsterdam in 1666.", "body": ["Voskan's press at Amsterdam gives the Armenians a printing tradition the Greeks lack. In this timeline his printing is what the Jerusalem agreement ([[synod-of-jerusalem-1672]]) builds on for the corrected texts and seminary books."], "facts": [], "faith": ["miaphysite"], "office": "Bishop and printer", "rel": [], "color": null, "basis": "Real person, in the role history gave them.", "open_q": [], "branch_of": null, "role": "scholar", "wiki": "Voskan Yerevantsi", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "zurich-settlement", "t": "doc", "name": "The Zurich Crisis and Cantonal Settlement", "st": "canon", "when": "Late 1520s–early 1530s", "y": 1530, "y2": null, "sum": "A brief internal crisis produces a delayed Zurich Reformation and a negotiated peace with the Catholic cantons.", "body": ["Without Zwingli’s preaching campaign, evangelical reform reaches Zurich through visiting preachers, print and correspondence with Basel and Strasbourg. [[leo-jud]] becomes its leading local minister. Reform divides the council, guilds and clergy before a brief internal crisis forces a settlement.", "The council authorizes reform within Zurich while negotiating coexistence with the Catholic cantons. Neither side secures a right to impose its confession on the other. The settlement avoids the historical Kappel campaigns without assuming that confessional antagonism disappears.", "Jud’s church grows through municipal consent and inter-cantonal compromise. [[bullinger]] inherits this settlement after Jud’s death in 1542. His later support for [[lambeth-council]] grows from an established habit of negotiating unity without requiring identical local institutions."], "facts": [["Date", "Late 1520s–early 1530s"], ["Kind", "Settlement"], ["Parties", "Zurich council, evangelical clergy and Catholic cantons"], ["Effect", "Delayed reform; negotiated cantonal coexistence"]], "faith": ["cranmerian", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "piedmont-bargain", "t": "doc", "name": "The Franco-Imperial Bargain over Piedmont", "st": "canon", "when": "1552", "y": 1552, "y2": null, "sum": "Charles V accepts a French foothold around Turin in exchange for French neutrality during the Princes’ Revolt.", "body": ["Henry II possesses bargaining power in the French occupation of Piedmont. Charles V chooses to concede ground in Italy rather than fight France and the German princes simultaneously. He accepts continued French possession of Turin and a Piedmontese foothold in exchange for French neutrality in the [[princes-revolt]].", "The bargain deprives Maurice’s coalition of the active French military support on which its strategy depends. It is a diplomatic exchange of territories and strategic freedom, not French approval of imperial religious policy. France can later protect evangelical clients without having rescued this revolt.", "Milan and Naples remain Habsburg possessions. The durable limits of the French foothold are confirmed in the revised [[cateau-cambresis]] settlement; the rights of the House of Savoy outside that foothold remain a matter for negotiation."], "facts": [["Date", "1552"], ["Kind", "Settlement"], ["Parties", "Charles V and Henry II"], ["Effect", "French foothold at Turin; French neutrality in Germany"]], "faith": ["roman-catholic", "gallican-church"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "princes-revolt", "t": "battle", "name": "The Princes’ Revolt", "st": "canon", "when": "1552", "y": 1552, "y2": null, "sum": "Maurice’s pan-Protestant rising fails after France trades German intervention for a foothold in Piedmont.", "body": ["Maurice turns against the imperial order he helped establish. Restrictions left by the [[schmalkaldic-war]], resentment of the Interim and fear of permanent imperial domination draw princes and churches into a pan-Protestant movement. Its political breadth exceeds the doctrinal agreement actually achieved at [[lambeth-council]].", "The [[piedmont-bargain]] removes active French intervention. Charles concentrates against the coalition, whose isolated forces fail to obtain the decisive strategic breakthrough. Maurice dies during the revolt; the coalition fails to force the historical settlement of Passau.", "Gnesio-Lutheran dissidents interpret Maurice’s death as divine judgment on religious compromise. This is their polemical claim, not the narrator’s explanation. His brother and successor [[augustus-of-saxony]] is persuaded by their cause. The defeat strengthens Gnesio influence in electoral Saxony while leaving other evangelical survivors more dependent on English and French protection.", "Foreign protection remains conditional: the same France that abandoned the revolt for Italian gains may later shelter its survivors. Neither foreign patron can be treated as a dependable substitute for a German military coalition."], "facts": [["Date", "1552"], ["Place", "Holy Roman Empire"], ["Sides", "Charles V against Maurice and the allied princes"], ["Result", "Imperial victory; Maurice killed"]], "faith": ["cranmerian", "gnesio-catholic", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "augustus-of-saxony", "t": "monarch", "name": "Augustus, Elector of Saxony", "st": "canon", "when": "Elector 1552–86", "y": 1552, "y2": 1586, "sum": "Maurice’s brother and successor, persuaded by the Gnesio interpretation of the failed revolt.", "body": ["Augustus succeeds when [[maurice-of-saxony]] dies in the [[princes-revolt]] of 1552. Gnesio-Lutheran dissidents interpret the defeat as judgment on Maurice’s compromises, and Augustus becomes convinced of their cause.", "His accession disrupts the earlier Philippist ascendancy in Albertine Saxony. Philippist ministers and scholars remain, but they no longer enjoy an assured monopoly of princely support. This changes the balance within Germany without turning the Gnesio party into an ally of Lambeth.", "The existing later-century and seventeenth-century entries assume a Cranmerian Saxon court. How that later alignment emerges after this Gnesio turn remains unsettled; it must not be projected backward onto Augustus’s accession."], "facts": [], "faith": ["gnesio-catholic"], "office": "Elector of Saxony", "rel": [], "color": null, "basis": "Real person in a hypothetical role.", "open_q": ["How the Gnesio turn under Augustus gives way to the later Cranmerian court already recorded in the compendium."], "branch_of": null, "role": null, "wiki": "Augustus, Elector of Saxony", "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "lambeth-constitution", "t": "doc", "name": "The Apostolic Constitution of Lambeth", "st": "canon", "when": "1549–52", "y": 1552, "y2": null, "sum": "A synodal episcopate and recognition of existing ministers give the Communion a shared institutional form.", "body": ["Lambeth describes episcopacy as a providential yet ultimately prudential development of apostolic church order. Its constitution can therefore affirm episcopal continuity without requiring every participating church to teach that a distinct episcopal office is universally indispensable by divine command.", "Continental churches with Presbyterian government retain their synods and recognize their existing ministers. New bishops, chosen to represent the individual synods, receive joint ordination from an English bishop and a Lutheran superintendent. Recognition of existing ministry is not conditional on repeating the ordinations of every pastor.", "The synodal representatives function as bishops within the Communion. Local titles such as superintendent and archpresbyter continue, creating overlapping habits of government. Canterbury has seniority without becoming a universal court ruling all member churches.", "The claim to be Apostolic, Reformed Catholics rests on continuity of teaching, inherited ordination and common church order. Its critics dispute both the prudential account of episcopacy and the decision to preserve the [[unchanged-ordinal]]."], "facts": [["Date", "1549–52"], ["Kind", "Settlement"], ["Parties", "English bishops and participating evangelical churches"], ["Effect", "Existing ministers recognized; new bishops jointly ordained"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "unchanged-ordinal", "t": "doc", "name": "The Unchanged Ordinal Controversy", "st": "canon", "when": "1549–52 and after", "y": 1552, "y2": null, "sum": "Cranmer retains the inherited ordination rite for polemical purposes despite rejecting the Roman theology of the Mass.", "body": ["Cranmer does not introduce the changes to the ordination rite associated with the historical Edwardian Ordinals. He preserves the inherited rite while rejecting the Roman understanding of the Mass. This decision is deliberate propaganda against Roman opponents: the reformed churches claim that they have not abandoned the historic ministry.", "The retained rite operates alongside the [[lambeth-constitution]], including joint ordination of new synodal bishops and recognition of existing ministers. Preservation of the rite is not an acceptance of Roman eucharistic doctrine, and it does not by itself obtain Roman recognition of the Communion’s orders.", "The combination is extremely controversial. Reformed opponents dispute the rites and episcopal settlement as well as the [[lambeth-formula]]. Some German principalities and Dutch towns refuse the union, though they are a minority. Scottish and French Reformed resistance makes ministry and church government central to the limits of the pan-Protestant project."], "facts": [["Date", "1549–52 and after"], ["Kind", "Settlement"], ["Parties", "Cranmer, Lambeth delegates and opponents of the settlement"], ["Effect", "Inherited rite retained; controversy over ministry and doctrine"]], "faith": ["cranmerian", "hardline-reformed", "roman-catholic"], "office": null, "rel": [], "color": null, "basis": null, "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-lambeth-formula", "t": "text", "name": "The Lambeth Formula, as adopted", "st": "prop", "when": "1552", "y": 1552, "y2": null, "sum": "The agreed article on the Lord's Supper, in the draft form the council adopts.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The formula is the eucharistic settlement of the Communion ([[lambeth-formula]], [[lambeth-council]]).", "> Of the Supper of the Lord.", "> We confess that in the Supper Christ is present, truly and spiritually, by the working of the Holy Spirit, through the prayer of consecration; and that this presence is not made by the faith of him that receiveth, nor unmade by his unbelief.", "> We deny that the bread and wine are changed in their substance, as the schools of Rome have taught. We deny also that the body of Christ is in all places, or is received with the mouth together with the bread, as some of Wittenberg have taught.", "> We confess that the benefit of the Supper, which is the forgiveness of sins and union with Christ, comes to the receiver by faith alone; and that the unbelieving receive the sign to their judgment, and not the thing signified to their benefit.", "> Therefore we bid our churches not to dispute further whether Christ is present by the consecration or by the receiving, since we have said that he is present by the one and given by the other."], "facts": [["Kind", "Primary source"], ["Date", "1552"], ["Author or voice", "The council of Lambeth"], ["Concerns", "The Lord's Supper"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-capitulation-wittenberg", "t": "text", "name": "Articles of the Capitulation of Wittenberg", "st": "prop", "when": "19 May 1547", "y": 1547, "y2": null, "sum": "The terms by which the Ernestine elector gives up the city and the electoral title.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The terms follow the rout at Mühlberg ([[muhlberg]], [[schmalkaldic-war]], [[capitulation-of-wittenberg]]).", "> I. John Frederick, late Elector of Saxony, yields the city of Wittenberg with its castle, its arms and its university into the hands of His Imperial Majesty.", "> II. He renounces the electoral dignity and the lands attached to it, which His Majesty bestows on his cousin Maurice. He keeps the lands and towns of Thuringia for himself and his heirs, as a duke.", "> III. He shall stay in His Majesty's keeping until the peace be made, and shall do nothing against the Emperor or the Empire.", "> IV. The preachers and professors of Wittenberg shall not be harmed in their persons or their goods for what they have taught, until His Majesty's religious order be published.", "> V. The League of Schmalkalden is dissolved, and its alliances, its common chest and its captains are given up."], "facts": [["Kind", "Primary source"], ["Date", "19 May 1547"], ["Author or voice", "Imperial commissioners"], ["Concerns", "The surrender of Wittenberg"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-cranmer-invitation", "t": "text", "name": "Cranmer's Invitation to the Evangelical Churches", "st": "prop", "when": "1548", "y": 1548, "y2": null, "sum": "A letter that invites the beaten churches of Germany and the Swiss cities to a council in England.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "Sent in the year after the League was destroyed ([[schmalkaldic-war]]), to Melanchthon, Bullinger, Bucer, Vermigli and à Lasco ([[lambeth-council]]).", "> To our brethren in Christ, health.", "> You have seen what the sword has done. The princes who were your shield are taken or scattered, and the Emperor will make an order for you which you did not choose. We do not write to stir you to a war; we write to ask you to a council.", "> The King of England, our young master, and his counsellors will give you a roof, a hall and safe conduct. We ask nothing of you but that you come with open hands, and that you bring the confession of your churches, that we may see in what we agree and in what we may bear with one another.", "> We do not mean to make one church of all. We mean to make one table, at which the churches that confess Christ alone may sit without anathema.", "> From Lambeth, in the second year of the King."], "facts": [["Kind", "Primary source"], ["Date", "1548"], ["Author or voice", "Thomas Cranmer"], ["Concerns", "The invitation to Lambeth"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-calvin-refusal", "t": "text", "name": "Calvin's Reply to the Lambeth Formula", "st": "prop", "when": "1552", "y": 1552, "y2": null, "sum": "A letter that declines to sign the eucharistic formula.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "Calvin and the Geneva church stay outside the Communion ([[calvin]], [[hardline-reformed]], [[lambeth-formula]]).", "> To the most reverend Archbishop of Canterbury.", "> I would gladly be one with you, and I thank you for the pains you have taken. But I cannot subscribe to a presence that does not wait for faith. You say that Christ is present by the consecration, whether the receiver believes or not. I say that he is given where he is received, and that to set his presence in the prayer of a minister is to give the minister what belongs to the Spirit.", "> I know that your meaning is not Rome's. But the simple will not know it, and the ministers who come after you will make of it what they please.", "> We shall not write against you, and we shall not be your enemies. We beg you only not to ask of us what we cannot do."], "facts": [["Kind", "Primary source"], ["Date", "1552"], ["Author or voice", "John Calvin"], ["Concerns", "Geneva's refusal"]], "faith": ["hardline-reformed"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-settlement-1577", "t": "text", "name": "Articles of the Settlement of France", "st": "prop", "when": "1577", "y": 1577, "y2": null, "sum": "The framework that gives France its Gallican–Augustinian settlement and protects the Cranmerian Huguenots.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The edict's name and date are not fixed in canon ([[poissy]], [[edict-for-huguenots]]). This draft follows the proposed ratification of 1576–77.", "> I. The Primate of Lyon shall convene the national synod of the Church of France, and shall hear the appeals of its bishops.", "> II. The King shall name the bishops, as the Concordat provides, and the Pope shall confirm them. The decrees of the council of Trent shall not be published in the Kingdom.", "> III. Those of the Reformed religion who hold the confession of Lambeth shall be suffered to live in their towns and to worship in the places the edict names, and shall not be troubled in their goods or their persons.", "> IV. Those who have followed Geneva and not Lambeth shall be suffered in their present places, and in no other.", "> V. The Admiral and the Princes of the blood shall be the guarantors of this peace."], "facts": [["Kind", "Primary source"], ["Date", "1577"], ["Author or voice", "The Crown, in the name of the King"], ["Concerns", "The settlement of the French wars"]], "faith": ["gallican-church", "cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": ["The real name and date of the edict."], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-filaret-excerpt", "t": "text", "name": "From the Catechism of Patriarch Filaret", "st": "prop", "when": "1627", "y": 1627, "y2": null, "sum": "An excerpt on Christ's work, in the Russian church's catechism.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The catechism teaches penal substitution and dual imputation ([[filaret-catechism]], [[filaret]]). The Kievan critics object ([[kiev-resisters]]); Zizanius is a source ([[lavrentiy-zizanius]]).", "> Q. Why did Christ suffer on the cross?", "> A. Because our sins were laid upon him, and he bore the punishment that was ours. In him the wrath of God against sin was spent, so that we might be quit of it.", "> Q. How are we made righteous?", "> A. Our sin is reckoned to Christ, and his righteousness is reckoned to us, and so we stand before God as those who have kept the law. But this is not all: through the Spirit we are made partakers of the divine nature, and the image that was lost is restored in us.", "> Q. Is the book of Wisdom Scripture?", "> A. It is a book of the apostolic tradition, handed down from the time of the second temple, and the Church reads it for instruction, but it is not set beside the books which Christ and his apostles cited."], "facts": [["Kind", "Primary source"], ["Date", "1627"], ["Author or voice", "Patriarch Filaret and his drafters"], ["Concerns", "The Russian catechism"]], "faith": ["russian-orthodox"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-jerusalem-decree", "t": "text", "name": "Decree of the Synod of Jerusalem on the Armenian Church", "st": "prop", "when": "1672", "y": 1672, "y2": null, "sum": "The synod's act of agreement with the Armenian Church.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The synod sits as the Greek world's answer to Trent and Florence ([[synod-of-jerusalem-1672]], [[dositheos-of-jerusalem]], [[hakob-iv-julfa]]).", "> We, the patriarchs and bishops here gathered, with the Catholicos of the Armenians and his bishops, declare that we confess one Christ, perfect God and perfect man, and that the Word of God made flesh is one incarnate nature of God the Word, as holy Cyril taught.", "> We, the Greeks, receive that formula as orthodox. We, the Armenians, confess that the two natures of which the council of Chalcedon spoke are not a division, and that we do not hold with Nestorius.", "> Each church shall keep its own liturgy, its own calendar and its own bishops. Where we are scattered among each other in the cities of the Sultan and of the Franks, our faithful may receive the mysteries from either.", "> We shall open schools for the instruction of the clergy, and we shall print the books of our rites from corrected texts, that those who come after us may be taught and may teach."], "facts": [["Kind", "Primary source"], ["Date", "1672"], ["Author or voice", "The Synod of Jerusalem"], ["Concerns", "Agreement with the Armenians; reform of liturgy and seminaries"]], "faith": ["eastern-orthodox", "miaphysite"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-bossuet-catechism", "t": "text", "name": "From the Catechism of the Gallican Church", "st": "prop", "when": "1690s", "y": 1695, "y2": null, "sum": "The passage on councils that causes the controversy.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The passage says the canons of Constance and Basel bind because the pope confirms them ([[gallican-catechism]], [[bossuet]]).", "> Q. Do the councils of Constance and of Basel bind the faithful?", "> A. Their canons bind, for they were confirmed by the Pope. It is not the number of the bishops nor the voice of the Kings that gives a council its force; it is that the head and the members are one body, and that the head consents.", "> Q. Then the Pope is above a council?", "> A. The Pope is the head, and a head is not above the body; but the body does nothing as a body without its head. This is the doctrine of the Church of France, which has never been in opposition to the Apostolic See."], "facts": [["Kind", "Primary source"], ["Date", "1690s"], ["Author or voice", "Jacques-Bénigne Bossuet"], ["Concerns", "The catechism's disputed passage"]], "faith": ["gallican-church"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "src-proclamation-charles-ii", "t": "text", "name": "Proclamation of Charles II by the Royalist Council", "st": "prop", "when": "1645", "y": 1645, "y2": null, "sum": "The Royalists proclaim the deposed king's son.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "Issued after Naseby ([[naseby]], [[english-war]], [[charles-ii]]).", "> Whereas our late sovereign lord has put himself into the hands of his enemies and, by the choice of the Commons, no longer governs as a king of England ought, we the bishops, peers and officers of the Navy and the kingdom do declare that his son Charles is our lawful King.", "> We protest that we make no change in religion, nor in the laws of the realm; we restore the old constitution and the order of bishops as it stood.", "> God save the King."], "facts": [["Kind", "Primary source"], ["Date", "1645"], ["Author or voice", "The Royalist Council"], ["Concerns", "The proclamation of Charles II"]], "faith": ["cranmerian", "byzantinists"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-muhlberg", "t": "text", "name": "A Relation of the Battle at Mühlberg", "st": "prop", "when": "May 1547", "y": 1547, "y2": null, "sum": "A Saxon chronicler's account of the day the army was lost.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The account is in a Wittenberg chronicler's voice ([[muhlberg]], [[schmalkaldic-war]]).", "> On the twenty-fourth of April, a Sunday, the Emperor's army came down to the Elbe before light and found a ford which our scouts had not marked. The fog was so thick that we heard the horses before we saw them.", "> The Elector was at his sermon when the Spanish were across. By ten of the clock there was no army to command.", "> Our lord was taken in the wood, wounded in the face, and brought to the Emperor. They say that the Emperor looked at him and said nothing for a long while. We do not know what the Emperor thought. We know what the people of Wittenberg thought, who counted the carts that did not come back."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "May 1547"], ["Author or voice", "A Saxon chronicler"], ["Concerns", "Mühlberg"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-london-naseby", "t": "text", "name": "The London Intelligencer on Naseby", "st": "prop", "when": "June 1645", "y": 1645, "y2": null, "sum": "A newsbook report from the Reforming Crown's side after the defeat.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "A newsbook's voice, hostile to the victors ([[naseby]], [[prince-rupert]], [[english-war]]).", "> From Northampton, the sixteenth of June. It is certain that Prince Rupert's horse have broken the right wing of the army, and that our foot have been cut to pieces upon the hill. The King has fled; his Majesty's coach was taken, and many papers in it.", "> The Royalists give out that they are for the Church and the constitution. We have noted that they have the Church of England's bishops on their side, and the Navy. It seems the Navy does not care for the King's reforms, and the bishops do not care for his conscience.", "> We are told that they will now proclaim the young prince. We pray that God will have mercy on the poor commons, who have trusted a King, and been left by him."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "June 1645"], ["Author or voice", "A London newsbook"], ["Concerns", "Naseby"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-magdeburg", "t": "text", "name": "A True Relation of the Sack of Magdeburg", "st": "prop", "when": "May 1631", "y": 1631, "y2": null, "sum": "A Gnesio-Catholic account of the burning of the city.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "A relation circulated from Hamburg and Stockholm ([[sack-of-magdeburg]], [[tilly]], [[siege-magdeburg]]).", "> The twentieth of May, in the morning, the Imperialists came in by the gate that was not guarded. By noon the whole city was on fire, and the cathedral was full of those who had fled for sanctuary. There was no quarter.", "> The city that refused the Interim, and stood a siege in the year fifty and fifty-one, is now a field of ash. Flacius would have wept. We are told that the Count Tilly was not able to stop it.", "> Let it be known to all Christians what the Emperor's friends do."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "May 1631"], ["Author or voice", "A Hamburg printer"], ["Concerns", "The sack of Magdeburg"]], "faith": ["gnesio-catholic"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-dort", "t": "text", "name": "A Report from Dort", "st": "prop", "when": "May 1619", "y": 1619, "y2": null, "sum": "An Amsterdam courant on the end of the synod and the execution at The Hague.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "The courant's voice ([[synod-of-dort]], [[oldenbarnevelt]], [[maurice-of-nassau]], [[gomarus]]).", "> The synod of Dort is ended, and the doctrine of the Remonstrants is condemned in five articles. The Remonstrant ministers are deposed and some banished.", "> At The Hague, on the thirteenth of May, the Advocate of Holland, Mr. Johan van Oldenbarnevelt, was beheaded in the court of the Binnenhof, in the seventy-second year of his age. He walked to the scaffold with a staff, and spoke to the people.", "> It is observed that the Archbishop of Canterbury's divines sat at the synod, and did not all agree with the verdict."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "May 1619"], ["Author or voice", "An Amsterdam courant"], ["Concerns", "Dort and the execution"]], "faith": ["cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-lyon-gazette", "t": "text", "name": "The Gazette of Lyon on the Ratification", "st": "prop", "when": "1577", "y": 1577, "y2": null, "sum": "A Lyon report on the settlement's ratification.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "A Gallican voice ([[src-settlement-1577]], [[poissy]], [[coligny]]).", "> The King has set his hand to the peace. The Primate of Lyon is to sit as judge of the Church of France, and the Admiral is to be guarantor for those of the Religion. The Parlement of Paris resists, but is not heard.", "> It is said that the Admiral came to the city in a plain coat. He heard Vespers in the cathedral and said that he had not found the music so ill."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "1577"], ["Author or voice", "A Lyon gazette"], ["Concerns", "The French settlement"]], "faith": ["gallican-church", "cranmerian"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "chr-constantinople-avviso", "t": "text", "name": "An Avviso from Constantinople on the Synod of Jerusalem", "st": "prop", "when": "1672", "y": 1672, "y2": null, "sum": "A Venetian report to the Doge on the Greek-Armenian agreement.", "body": ["In-world text: the wording is invented for this timeline and is not a historical quotation.", "A Venetian newsletter ([[synod-of-jerusalem-1672]], [[hakob-iv-julfa]], [[voskan-yerevantsi]]).", "> The Greek patriarchs are lately come back from Jerusalem and report that they and the Armenian Catholicos have signed a concord on the nature of Christ. It is thought to be a thing of great consequence, for the Armenians are many, and spread over all the trade of the East.", "> The Sultan's ministers have not forbidden it. The Franks of Galata are alarmed, and the Jesuits say it is a contrivance of the Muscovites against Rome; but the Muscovites are said to be displeased.", "> The printing of books is to begin at Constantinople in the coming year."], "facts": [["Kind", "Chronicle or newspaper"], ["Date", "1672"], ["Author or voice", "A Venetian informant"], ["Concerns", "The Synod of Jerusalem"]], "faith": ["eastern-orthodox", "miaphysite"], "office": null, "rel": [], "color": null, "basis": "Drafted for the compendium; wording is invented.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": null, "beliefs": [], "structure": [], "theologians": []}, {"id": "hand-timeline", "t": "text", "name": "Timeline of battles, councils and documents, 1500–1700", "st": "canon", "when": "1500–1700", "y": 1500, "y2": null, "sum": "Every battle, council, treaty and document in the compendium, in order.", "body": ["Generated from the compendium's entries, so it matches them. Statuses: canon, historical, proposed."], "facts": [["Kind", "Reference handout"], ["Rows", "129"]], "faith": [], "office": null, "rel": [], "color": null, "basis": "Generated from the data.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": [["Year", "Event", "Kind", "Status"], [["1500", "[[vedrosha|Battle of Vedrosha]]", "Battle", "Historical"], ["1512", "[[ravenna|Battle of Ravenna]]", "Battle", "Historical"], ["1512", "[[lateran-v|Fifth Lateran Council]]", "Council or document", "Historical"], ["1513", "[[flodden|Battle of Flodden]]", "Battle", "Historical"], ["1514", "[[chaldiran|Battle of Chaldiran]]", "Battle", "Historical"], ["1514", "[[orsha|Battle of Orsha]]", "Battle", "Historical"], ["1515", "[[marignano|Battle of Marignano]]", "Battle", "Canon"], ["1516", "[[marj-dabiq|Battle of Marj Dabiq]]", "Battle", "Historical"], ["1516", "[[concordat-of-bologna|Concordat of Bologna]]", "Council or document", "Canon"], ["1517", "[[ridaniya|Battle of Ridaniya]]", "Battle", "Hi |Francis, Duke of Guise]], [[palestrina|Giovanni Pierluigi da Palestrina]], [[lassus|Orlande de Lassus]], [[charles-borromeo|Charles Borromeo]], [[zrinski|Nikola Šubić Zrinski]], [[baius|Michael Baius]], [[plantin|Christophe Plantin]], [[don-john-of-austria|John of Austria]], [[el-greco|El Greco]], [[alexander-farnese|Alexander Farnese, Duke of Parma]], [[zamoyski|Jan Zamoyski]], [[robert-bellarmine|Robert Bellarmine]], [[luis-de-molina|Luis de Molina]], [[francisco-suarez|Francisco Suárez]], [[caravaggio|Caravaggio]], [[francis-de-sales|Francis de Sales]], [[chodkiewicz|Jan Karol Chodkiewicz]], [[paolo-sarpi|Paolo Sarpi]], [[zolkiewski|Stanisław Żółkiewski]], [[rubens|Peter Paul Rubens]], [[monteverdi|Claudio Monteverdi]], [[tilly|Count of Tilly]], [[olivares|Gaspar de Guzmán, Count-Duke of Olivares]], [[urban-viii|Urban VIII]], [[ambrogio-spinola|Ambrogio Spinola]], [[wallenstein|Albrecht von Wallenstein]], [[pappenheim|Gottfried Heinrich zu Pappenheim]], [[galileo|Galileo Galilei]], [[velazquez|Diego Velázquez]], [[jansen|Cornelius Jansen]]"], ["[[russian-orthodox|Russian Orthodox Church]]", "[[nil-sorsky|Nil Sorsky]], [[joseph-volotsky|Joseph of Volotsk]], [[maximus-the-greek|Maximus the Greek]], [[job|Patriarch Job]], [[hermogenes|Patriarch Hermogenes]], [[pozharsky|Dmitry Pozharsky]], [[minin|Kuzma Minin]], [[filaret|Patriarch Filaret]], [[lavrentiy-zizanius|Lavrentiy Zizanius]], [[joasaph-i|Patriarch Joasaph I]], [[simeon-polotsky|Simeon of Polotsk]], [[simon-ushakov|Simon Ushakov]], [[feofan-prokopovich|Feofan Prokopovich]]"], ["[[ruthenian-uniate|Ruthenian Uniate Church]]", "[[hypatius-pociej|Hypatius Pociej]], [[josyf-rutsky|Josyf Rutsky]], [[josaphat-kuntsevych|Josaphat Kuntsevych]]"], ["[[shia|Shia Islam]]", "[[al-karaki|Ali al-Karaki]], [[al-mansur-al-qasim|Al-Mansur al-Qasim]], [[shaykh-bahai|Shaykh Bahai]], [[mulla-sadra|Mulla Sadra]]"], ["[[sunni|Sunni Islam]]", "[[barbarossa|Hayreddin Barbarossa]], [[ebussuud|Ebussuud Efendi]], [[birgivi|Mehmed Birgivi]], [[sokollu-mehmed|Sokollu Mehmed Pasha]], [[kara-mustafa|Kara Mustafa Pasha]]"], ["[[evangelical-unaligned|Unaligned Evangelicals]]", "[[osiander|Andreas Osiander]]"], ["[[unitarian|Unitarian Church of Transylvania]]", "[[ferenc-david|Ferenc Dávid]], [[giorgio-biandrata|Giorgio Biandrata]]"], ["[[unity-brethren|Unity of the Brethren]]", "[[jan-blahoslav|Jan Blahoslav]], [[jan-rokyta|Jan Rokyta]], [[budovec|Wenceslas Budovec]], [[comenius|Jan Amos Comenius]]"], ["[[utraquist-rite|Utraquist Rite in Union with Rome]]", "[[harrach|Ernst Adalbert von Harrach]]"], ["[[western-rite-orthodox|Western-Rite Orthodox Church]]", "[[johannes-matthiae|Johannes Matthiae]]"]]], "beliefs": [], "structure": [], "theologians": []}, {"id": "hand-faiths", "t": "text", "name": "Comparison of the faiths", "st": "canon", "when": "1500–1700", "y": 1500, "y2": null, "sum": "Each community's leading belief and its form of governance, side by side.", "body": ["Generated from the compendium's entries, so it matches them. Statuses: canon, historical, proposed."], "facts": [["Kind", "Reference handout"], ["Rows", "24"]], "faith": [], "office": null, "rel": [], "color": null, "basis": "Generated from the data.", "open_q": [], "branch_of": null, "role": null, "wiki": null, "table": [["Community", "Leading belief", "Governance"], [["[[roman-catholic|Roman Communion]]", "Justification: Trent's Session 6 is softened ([[council-of-trent]]): imputed righteousness may stand beside inherent righteousness.", "Pope and curia at Rome; cardinals in consistory; bishops nominated by local custom or by the Crown and confirmed by Rome (the Concordat of Bologna, [[concordat-of-bologna]])."], ["[[gallican-church|Gallican–Augustinian Church]]", "Gallican liberties: The Crown nominates and Rome confirms.", "The Primate of Lyon ([[alphonse-de-richelieu]], [[pierre-d-epinac]]) convenes the national synod and acts as court of appeal."], ["[[utraquist-rite|Utraquist Rite in Union with Rome]]", "Communion in both kinds: The chalice for the laity, the old Hussite sign, now permitted by Rome as part of the settlement.", "Under the Archbishop of Prague ([[harrach]]), in full union with Rome."], ["[[gnesio-catholic|Gnesio-Catholic Church]]", "Justification: By faith alone, as Luther taught, with the 1530 Augsburg Confession ([[augsburg-confession]]) as the legal banner.", "Bishops in the historic succession, with synodal government."], ["[[cranmerian|Cranmerian–Philippist Communion]]", "The Lambeth formula: Christ is spiritually present in the Supper through the Spirit and the consecration.", "Two systems overlap."], ["[[hardline-reformed|Hardline Reformed Churches]]", "Eucharist: The presence is spiritual and given only to the believing receiver.", "Presbyterian: ministers, elders and deacons; consistory, presbytery, provincial and national assembly."], ["[[byzantinists|Byzantinist Church Party]]", "Eucharist: A high reading of the Lambeth formula: the presence through consecration ([[john-cosin]]), with an emphasis on epiclesis taken from the Greek liturgies.", "An Anglican party, not a separate church, rooted in the West Country."], ["[[evangelical-unaligned|Unaligned Evangelicals]]", "Justification: Evangelical, by faith alone, but without commitment to either Wittenberg party.", "Local church orders in Courland and Livonia under their dukes and city councils; no common hierarchy."], ["[[unity-brethren|Unity of the Brethren]]", "Heritage: The Hussite tradition of the Bohemian reformation, with a strong discipline and a practical ethic.", "Bishops (seniors) and a synod; local congregations and strict discipline."], ["[[unitarian|Unitarian Church of Transylvania]]", "Antitrinitarianism: God is one person.", "A superintendent (bishop) in Kolozsvár and congregational synods, recognised by the principality's Diet as one of its legitimate religions."], ["[[polish-brethren|Polish Brethren]]", "Antitrinitarianism: Socinian: Christ is a man raised to divinity, rationalist reading of Scripture.", "Congregations and a synod, with Raków as the intellectual centre."], ["[[anabaptist|Anabaptists and Mennonites]]", "Believer's baptism: Baptism is for adults who confess.", "Local congregations with elders; no state church."], ["[[eastern-orthodox|Eastern Orthodox Churches]]", "Theosis and the Fathers: The first seven councils, the Greek Fathers, the liturgy as the centre of faith.", "Patriarchates (Constantinople, Alexandria, Antioch, Jerusalem), the Serbian Patriarchate of Peć and the self-governing Archbishopric of Ohrid."], ["[[russian-orthodox|Russian Orthodox Church]]", "The catechism of 1627: Filaret's catechism ([[filaret-catechism]]): material sufficiency of Scripture, the deuterocanon as Second Temple apostolic tradition, penal substitution and dual imputation.", "A patriarchate since 1589 ([[job]])."], ["[[western-rite-orthodox|Western-Rite Orthodox Church]]", "Orthodox creed: The Nicene creed without the filioque, and leavened bread, given up as the price of recognition.", "Primate at Narva, in 1635 Johannes Matthiae ([[johannes-matthiae]]), under the Patriarch of Moscow as a vicariate and protected by treaty inside Gnesio-Catholic Sweden."], ["[[ruthenian-uniate|Ruthenian Uniate Church]]", "Union with Rome: Papal primacy accepted, the filioque tolerated in the Roman creed.", "The Uniate Metropolitan of Kiev ([[josyf-rutsky]]) and bishops, in communion with Rome."], ["[[sunni|Sunni Islam]]", "Law: Hanafi in the Ottoman lands, Maliki in North Africa.", "The Ottoman sultan holds the caliphal claim from 1517 ([[ridaniya]])."], ["[[shia|Shia Islam]]", "Twelver doctrine: Twelve imams, the hidden imam, state-sponsored mourning rites.", "Safavid shahs and Persian ulema, with Arab Jabal Amil scholars invited by Tahmasp ([[al-karaki]])."], ["[[ibadi|Ibadi Islam]]", "Imamate: An elected imam, a distinct and moderate Ibadi theology.", "Oman's imamate, with a tribal consultative council."], ["[[judaism|Jewish Communities]]", "Halakha: Karo's Shulchan Aruch with Isserles' glosses ([[joseph-karo]], [[moses-isserles]]) become the common code.", "Local kehillot and rabbinic courts."], ["[[miaphysite|Miaphysite Churches]]", "Christology: One incarnate nature of the divine Word, the Cyrilline formula.", "Separate patriarchates: Alexandria, Etchmiadzin, Sis, Mardin, and the Ethiopian metropolitan."], ["[[church-east|Church of the East]]", "Christology: The East Syriac tradition, outside the Chalcedonian and the Miaphysite camps.", "A patriarch at Rabban Hormizd, with metropolitans in northern Iraq."], ["[[maronite|Maronite Church]]", "Roman communion: In communion with Rome, with a Syriac liturgy.", "A patriarch in Mount Lebanon, under Ottoman rule."], ["[[traditional-religions|Traditional Religions]]", "Diverse practice: Ancestral religion, shamanism and local cults, mapped as one category.", "Local authorities: lineage elders, chiefs, shamans."]]], "beliefs": [], "structure": [], "theologians": []}]}</script>
<script>
(function () {
  var ENT = JSON.parse(document.getElementById('data').textContent);
  var META = ENT.meta; ENT = ENT.entities;
  var ID = {}; ENT.forEach(function (e) { ID[e.id] = e; });
  var TYPES = { faith: 'Faith', person: 'Person', monarch: 'Monarch', faction: 'Faction', battle: 'Battle or war', doc: 'Council or document', text: 'Library text' };
  var SEC = [
    ['faiths', 'Faiths', 'faith'], ['leaders', 'People', 'person'], ['factions', 'Political factions', 'faction'],
    ['battles', 'Battles and wars', 'battle'], ['monarchs', 'Monarchs', 'monarch'], ['documents', 'Councils and documents', 'doc'], ['library', 'Library', 'text']
  ];
  var SNAP = [1500, 1525, 1550, 1575, 1600, 1618, 1635];
  function snapFor(y) { var r = SNAP[0]; SNAP.forEach(function (s) { if (s <= y) r = s; }); return r; }
  function mapHref(e) { return 'atlas.html#' + snapFor(e.y) + (e.t === 'faith' ? '-conf' : ''); }
  function mapLink(e) {
    var s = snapFor(e.y), late = e.y > 1635;
    return '<p class="maplink"><a class="chip" href="' + mapHref(e) + '">View on the ' + s + ' map</a>' + (late ? ' <span class="note">The atlas ends at 1635; later snapshots are outlined.</span>' : '') + '</p>';
  }
  var STATUS = { canon: 'Canon', hist: 'Historical', prop: 'Proposed' };
  var main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q');
  var filter = { status: 'all', role: 'all' };
  var ROLES = { leader: 'Religious leaders', theologian: 'Theologians', general: 'Generals and admirals', statesman: 'Statesmen', scholar: 'Scholars and scientists', artist: 'Artists and composers' };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function rich(s) {
    return esc(s).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, function (m, id, label) {
      var e = ID[id]; if (!e) return label || id;
      return '<a class="x" href="#' + id + '">' + (label || esc(e.name)) + '</a>';
    });
  }
  function byY(a, b) { return (a.y - b.y) || a.name.localeCompare(b.name); }
  function badge(st) { return '<span class="badge ' + st + '">' + STATUS[st] + '</span>'; }
  function sw(c) { return c ? '<span class="swatch" style="background:' + esc(c) + '" aria-hidden="true"></span>' : ''; }
  function ofType(t) { return ENT.filter(function (e) { return e.t === t; }).sort(byY); }

  /* backlinks */
  var BACK = {};
  ENT.forEach(function (e) {
    var blob = e.sum + ' ' + e.body.join(' ') + ' ' + e.rel.map(function (r) { return r[1]; }).join(' ') + ' ' + e.open_q.join(' ');
    var re = /\[\[([a-z0-9-]+)/g, m, seen = {};
    while ((m = re.exec(blob))) { if (m[1] !== e.id && !seen[m[1]]) { seen[m[1]] = 1; (BACK[m[1]] = BACK[m[1]] || []).push(e); } }
  });

  function card(e) {
    return '<a class="card" href="#' + e.id + '">' + (e.img ? '<img class="ph" src="' + esc(e.img) + '" alt="" loading="lazy">' : '') + '<div class="t"><span class="sw">' + sw(e.color) + '<b>' + esc(e.name) + '</b></span>' + badge(e.st) + '</div>' +
      '<span class="w">' + esc(e.when) + (e.role && e.t === 'person' ? ' · ' + ROLES[e.role].toLowerCase() : '') + '</span><p>' + esc(e.sum) + '</p></a>';
  }
  function statusChips(list) {
    var c = { all: list.length, canon: 0, hist: 0, prop: 0 };
    list.forEach(function (e) { c[e.st]++; });
    return '<div class="chips" role="group" aria-label="Filter by status">' + ['all', 'canon', 'hist', 'prop'].map(function (k) {
      return '<button class="chip" type="button" data-st="' + k + '" aria-pressed="' + (filter.status === k) + '">' + (k === 'all' ? 'All' : STATUS[k]) + ' <span class="n">' + c[k] + '</span></button>';
    }).join('') + '</div>';
  }
  function passes(e) { return filter.status === 'all' || e.st === filter.status; }

  /* ------------------------------------------------------------ views */
  function viewHome() {
    var forks = ['marignano', 'council-of-trent', 'lambeth-council', 'bohemian-union-1575', 'poissy', 'brest', 'xanten', 'white-mountain', 'filaret-catechism', 'english-war', 'peace-1648', 'catechism-1685']
      .map(function (id) { return ID[id]; }).filter(Boolean);
    var counts = SEC.map(function (s) { return '<span><b>' + ofType(s[2]).length + '</b>' + s[1].toLowerCase() + '</span>'; }).join('');
    var feat = ['roman-catholic', 'gallican-church', 'gnesio-catholic', 'cranmerian', 'hardline-reformed', 'western-rite-orthodox', 'russian-orthodox', 'byzantinists'].map(function (id) { return ID[id]; });
    return '<div class="eyebrow">Companion to the map of 1500–1789</div><h1>Alternate Reformation Compendium</h1>' +
      '<p class="lede">An encyclopedia of a world in which Zwingli dies at Marignano in 1515 and the Reformation reorders itself: a Gnesio-Catholic church that keeps seven sacraments, a Gallican France under the Primate of Lyon, a Russian church with a Lutheran-flavoured catechism, and an English king who leads the reformers.</p>' +
      '<div class="stat">' + counts + '</div>' +
      '<div class="body"><p>Each faith has a page, with its leaders, rulers, rivals and open questions. Leaders, monarchs, factions, battles and documents each have their own entries, all cross-linked. Every entry carries a status mark: <b>canon</b> if the map project settled it, <b>historical</b> if it is carried over from our history, and <b>proposed</b> if it is new here and waiting for your decision. The map itself is the <a href="https://claude.ai/code/artifact/71fe4da5-2d43-42d4-9ce3-f06505ce4cae">Alternate Reformation Atlas</a>.</p></div>' +
      '<div class="sec"><h2>Start with a faith</h2><div class="cards">' + feat.map(card).join('') + '</div><p><a href="#faiths">All ' + ofType('faith').length + ' faiths</a></p></div>' +
      '<div class="sec"><h2>The twelve forks</h2><p class="body" style="margin-bottom:6px">The points where this timeline leaves ours, in order.</p><ol class="forks">' +
      forks.map(function (e) { return '<li><span class="y">' + e.y + '</span><span><a href="#' + e.id + '"><b>' + esc(e.name) + '</b></a> ' + badge(e.st) + '<br><span style="color:var(--muted);font-size:15px">' + esc(e.sum) + '</span></span></li>'; }).join('') +
      '</ol></div>' +
      '<div class="sec"><h2>What is still open</h2><p class="body">The ' + ENT.reduce(function (n, e) { return n + e.open_q.length; }, 0) + ' open threads are gathered on <a href="#about">one page</a>, along with the 1700–1789 stretch, which is not yet written.</p></div>';
  }

  var FAMILY = META.families;
  function viewFaiths() {
    var all = ofType('faith').filter(function (e) { return !e.branch_of; });
    var html = '<div class="eyebrow">Faiths</div><h1>Faiths</h1><p class="lede">Every confession and jurisdiction on the map, with the Gnesio-Catholic branches shown under their parent.</p>' + statusChips(all);
    FAMILY.forEach(function (fam) {
      var items = fam[1].map(function (id) { return ID[id]; }).filter(function (e) { return e && passes(e); });
      if (!items.length) return;
      html += '<div class="group"><h2>' + esc(fam[0]) + '</h2><div class="cards">' + items.map(card).join('') + '</div></div>';
    });
    return html;
  }
  function viewLeaders() {
    var all = ofType('person'), list = all.filter(function (p) { return filter.role === 'all' || p.role === filter.role; });
    var rc = '<div class="chips" role="group" aria-label="Filter by role">' + ['all'].concat(Object.keys(ROLES)).map(function (k) {
      var n = k === 'all' ? all.length : all.filter(function (p) { return p.role === k; }).length;
      return n || k === 'all' ? '<button class="chip" type="button" data-role="' + k + '" aria-pressed="' + (filter.role === k) + '">' + (k === 'all' ? 'Everyone' : ROLES[k]) + ' <span class="n">' + n + '</span></button>' : '';
    }).join('') + '</div>';
    var html = '<div class="eyebrow">People</div><h1>People</h1><p class="lede">Religious leaders, theologians, generals, statesmen, scholars and artists, grouped by community. Everyone is a real person; some are placed in roles history did not give them, and those are marked as proposed. Heads of state have their own page under Monarchs.</p>' + rc + statusChips(list);
    var seen = {};
    META.leader_families.forEach(function (fam) {
      fam[1].forEach(function (fid) {
        var items = list.filter(function (p) { return p.faith[0] === fid && passes(p); });
        items.forEach(function (p) { seen[p.id] = 1; });
        if (!items.length) return;
        html += '<div class="group"><h2>' + sw(ID[fid].color) + ' <a href="#' + fid + '" style="color:inherit;text-decoration:none">' + esc(ID[fid].name) + '</a></h2><div class="cards">' + items.map(card).join('') + '</div></div>';
      });
    });
    var rest = list.filter(function (p) { return !seen[p.id] && passes(p); });
    if (rest.length) html += '<div class="group"><h2>Other communities</h2><div class="cards">' + rest.map(card).join('') + '</div></div>';
    return html;
  }
  function viewList(sec) {
    var list = ofType(sec[2]);
    var lede = { faction: 'Parties, blocs and schools, from the Philippists to the West Country.', battle: 'Battles, sieges and wars, with their effect on belief.', monarch: 'Rulers whose faith or policy shapes the map.', doc: 'Councils, treaties, confessions and edicts.' }[sec[2]];
    if (sec[2] === 'text') {
      var kinds = ['Primary source', 'Chronicle or newspaper', 'Reference handout'], blurbs = { 'Primary source': 'In-world documents: confessions, letters, treaties and decrees.', 'Chronicle or newspaper': 'Accounts in a chronicler\'s or newsbook\'s voice.', 'Reference handout': 'Tables generated from the compendium\'s data.' };
      return '<div class="eyebrow">Library</div><h1>Library</h1><p class="lede">Texts written for this alternate history. Primary sources and chronicles use invented wording and are marked proposed until approved. Handouts are generated from the entries.</p>' + statusChips(list) +
        kinds.map(function (k) { var items = list.filter(function (e) { return passes(e) && e.facts.some(function (r) { return r[0] === 'Kind' && r[1] === k; }); }); return items.length ? '<div class="group"><h2>' + esc(k) + 's</h2><p class="note">' + esc(blurbs[k]) + '</p><div class="cards">' + items.map(card).join('') + '</div></div>' : ''; }).join('');
    }
    return '<div class="eyebrow">' + esc(sec[1]) + '</div><h1>' + esc(sec[1]) + '</h1><p class="lede">' + esc(lede) + '</p>' + statusChips(list) +
      '<div class="cards">' + list.filter(passes).map(card).join('') + '</div>';
  }
  var BANDS = [
    [1500, 1549, 'Before and after the divergence', '1500–1549'], [1550, 1599, 'Interim, communion and settlement', '1550–1599'],
    [1600, 1647, 'The great war', '1600–1647'], [1648, 1699, 'After the peace', '1648–1699'], [1700, 1789, 'The eighteenth century', '1700–1789']
  ];
  function viewTimeline() {
    var types = filter.type || 'all';
    var html = '<div class="eyebrow">Timeline</div><h1>Timeline</h1><p class="lede">Every dated entry in order. Use the filters to follow one kind of event.</p>';
    html += '<div class="chips" role="group" aria-label="Filter by kind"><button class="chip" type="button" data-ty="all" aria-pressed="' + (types === 'all') + '">All</button>' +
      Object.keys(TYPES).map(function (t) { return '<button class="chip" type="button" data-ty="' + t + '" aria-pressed="' + (types === t) + '">' + TYPES[t] + '</button>'; }).join('') + '</div>';
    BANDS.forEach(function (b) {
      var items = ENT.filter(function (e) { return !e.table && e.y >= b[0] && e.y <= b[1] && (types === 'all' || e.t === types); }).sort(byY);
      html += '<section class="band"><h2>' + esc(b[2]) + ' <small>' + b[3] + '</small></h2>';
      if (!items.length) {
        html += '<div class="empty">' + (b[0] >= 1700 ? 'Not yet written. The map has no snapshot after 1700 yet, and the eighteenth century is the next stretch to plan.' : 'Nothing in this filter.') + '</div>';
      } else {
        html += items.map(function (e) {
          return '<div class="trow"><span class="y">' + esc(e.when.length > 14 ? e.y : e.when) + '</span><div class="m"><a class="nm" href="#' + e.id + '">' + esc(e.name) + '</a><span class="k">' + TYPES[e.t] + '</span> ' + badge(e.st) + '<p>' + esc(e.sum) + '</p></div></div>';
        }).join('');
      }
      html += '</section>';
    });
    return html;
  }
  function viewAbout() {
    var open = [];
    ENT.forEach(function (e) { e.open_q.forEach(function (t) { open.push([e, t]); }); });
    var c = { canon: 0, hist: 0, prop: 0 }; ENT.forEach(function (e) { c[e.st]++; });
    return '<div class="eyebrow">About this compendium</div><h1>Open threads</h1>' +
      '<p class="lede">What the compendium rests on, and what is still undecided.</p>' +
      '<div class="body"><p>The entries draw on the decisions recorded in the map project through the 1635 snapshot, together with the notes for the 1648, 1660, 1685 and 1700 maps. <b>' + c.canon + '</b> entries are canon, <b>' + c.hist + '</b> follow our history, and <b>' + c.prop + '</b> are proposed here. Everyone in the compendium is a real person. Proposed entries put a real person in a role history did not give them, or add a battle or document the map project has not fixed, and say which.</p>' +
      '<p>Nothing is written yet for the 1700–1789 stretch. The 1648–1700 snapshots are only outlined, so entries from those years are brief.</p></div>' +
      (META.credits && META.credits.length ? '<div class="sec"><h2>Portrait credits</h2><div class="scroll"><table class="table"><thead><tr><th>Person</th><th>Artist</th><th>License</th><th>Source</th></tr></thead><tbody>' + META.credits.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.artist || 'Unknown') + '</td><td>' + esc(c.license || '') + '</td><td>' + (c.source_url ? '<a href="' + esc(c.source_url) + '" rel="noopener">Commons</a>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div></div>' : '') +
      '<div class="sec"><h2>' + open.length + ' open threads</h2><div class="scroll"><table class="table"><thead><tr><th>Entry</th><th>Question</th></tr></thead><tbody>' +
      open.sort(function (a, b) { return byY(a[0], b[0]); }).map(function (r) { return '<tr><td><a href="#' + r[0].id + '">' + esc(r[0].name) + '</a></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }

  function viewEntity(e) {
    var h = '<div class="eyebrow"><span>' + TYPES[e.t] + '</span>' + badge(e.st) + '</div>';
    h += '<h1>' + (e.t === 'faith' ? sw(e.color) + ' ' : '') + esc(e.name) + '</h1><div class="when">' + esc(e.when) + '</div>';
    h += '<p class="lede">' + esc(e.sum) + '</p>';
    if (e.t !== 'faction' && e.t !== 'text') h += mapLink(e);
    var f = e.facts.slice();
    if (e.office && e.t !== 'faith') f.unshift(['Office', e.office]);
    if (e.t === 'person' && e.role) f.unshift(['Role', ROLES[e.role].replace(/s$/, '').replace('Religious leader', 'Religious leader')]);
    var fh = '';
    if (f.length || e.basis || e.img) {
      fh = '<aside class="facts" aria-label="Facts">' + (e.img ? '<img class="portrait" src="' + esc(e.img) + '" alt="Portrait of ' + esc(e.name) + '">' : '') + (e.wiki ? '' : '') + '<dl>' + f.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
      if (e.faith.length && e.t !== 'faith') {
        fh += '<p class="basis" style="margin-top:' + (f.length ? 10 : 0) + 'px"><b>Community:</b> ' + e.faith.map(function (id) { var x = ID[id]; return sw(x.color) + ' <a href="#' + id + '">' + esc(x.name) + '</a>'; }).join(', ') + '</p>';
      }
      if (e.basis) fh += '<p class="basis">' + esc(e.basis) + '</p>';
      fh += '</aside>';
    }
    h += '<div class="layout">' + fh + '<div class="body">' + e.body.map(function (p) { return p.indexOf('> ') === 0 ? '<blockquote class="src">' + rich(p.slice(2)) + '</blockquote>' : '<p>' + rich(p) + '</p>'; }).join('') + '</div></div>';
    h += '<div style="clear:both"></div>';
    if (e.table) h += '<div class="sec"><div class="scroll"><table class="table"><thead><tr>' + e.table[0].map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + e.table[1].map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + rich(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';

    if (e.t === 'faith') {
      var ids = [e.id].concat(ENT.filter(function (x) { return x.branch_of === e.id; }).map(function (x) { return x.id; }));
      var kids = ENT.filter(function (x) { return x.branch_of === e.id; }).sort(byY);
      if (e.beliefs && e.beliefs.length) h += '<div class="sec"><h3>Beliefs</h3><dl class="beliefs">' + e.beliefs.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + rich(r[1]) + '</dd>'; }).join('') + '</dl></div>';
      if (e.structure && e.structure.length) h += '<div class="sec"><h3>Structure and governance</h3><div class="body">' + e.structure.map(function (p) { return '<p>' + rich(p) + '</p>'; }).join('') + '</div></div>';
      if (e.theologians && e.theologians.length) h += '<div class="sec"><h3>Principal theologians and figures</h3><div class="cards">' + e.theologians.map(function (id) { return ID[id]; }).filter(Boolean).map(card).join('') + '</div></div>';
      if (kids.length) h += '<div class="sec"><h3>Branches</h3><div class="cards">' + kids.map(card).join('') + '</div></div>';
      if (e.rel.length) h += '<div class="sec"><h3>Relations</h3><div class="scroll"><table class="table"><tbody>' + e.rel.map(function (r) { var x = ID[r[0]]; return '<tr><td>' + (x ? sw(x.color) + ' <a href="#' + x.id + '">' + esc(x.name) + '</a>' : esc(r[0])) + '</td><td>' + rich(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
      var people = ENT.filter(function (x) { return x.t === 'person' && x.faith.some(function (id) { return ids.indexOf(id) >= 0; }); }).sort(byY);
      if (people.length) {
        var groups = {}, order = [];
        people.forEach(function (p) { var k = p.office || 'Other'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(p); });
        h += '<div class="sec"><h3>Leaders by office</h3><div class="scroll"><table class="table"><thead><tr><th>Office</th><th>Holder</th><th>Dates</th></tr></thead><tbody>' +
          order.map(function (k) { return groups[k].map(function (p, i) { return '<tr><td>' + (i === 0 ? esc(k) : '') + '</td><td><a href="#' + p.id + '">' + esc(p.name) + '</a> ' + (p.st === 'prop' ? badge('prop') : '') + '</td><td class="y">' + esc(p.when) + '</td></tr>'; }).join(''); }).join('') + '</tbody></table></div></div>';
      }
      var rulers = ENT.filter(function (x) { return x.t === 'monarch' && x.faith.some(function (id) { return ids.indexOf(id) >= 0; }); }).sort(byY);
      if (rulers.length) h += '<div class="sec"><h3>Rulers of this faith</h3><div class="scroll"><table class="table"><tbody>' + rulers.map(function (p) { return '<tr><td><a href="#' + p.id + '">' + esc(p.name) + '</a></td><td>' + esc(p.office || '') + '</td><td class="y">' + esc(p.when) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
      var evs = ENT.filter(function (x) { return (x.t === 'battle' || x.t === 'doc' || x.t === 'faction') && x.faith.some(function (id) { return ids.indexOf(id) >= 0; }); }).sort(byY);
      if (evs.length) h += '<div class="sec"><h3>Events, parties and documents</h3><div class="scroll"><table class="table"><tbody>' + evs.map(function (p) { return '<tr><td class="y">' + p.y + '</td><td><a href="#' + p.id + '">' + esc(p.name) + '</a></td><td>' + TYPES[p.t] + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    } else if (e.rel.length) {
      h += '<div class="sec"><h3>Relations</h3><div class="scroll"><table class="table"><tbody>' + e.rel.map(function (r) { var x = ID[r[0]]; return '<tr><td>' + (x ? '<a href="#' + x.id + '">' + esc(x.name) + '</a>' : esc(r[0])) + '</td><td>' + rich(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    }
    if (e.open_q.length) h += '<div class="openq"><h3>Open questions</h3><ul>' + e.open_q.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    var back = (BACK[e.id] || []).slice().sort(byY);
    if (back.length) {
      h += '<div class="sec"><h3>Mentioned in</h3><div class="chips">' + back.map(function (b) { return '<a class="chip" href="#' + b.id + '">' + esc(b.name) + '</a>'; }).join('') + '</div></div>';
    }
    var sibs = ofType(e.t), i = sibs.indexOf(e), sec = SEC.filter(function (s) { return s[2] === e.t; })[0];
    h += '<nav class="pn" aria-label="Neighbouring entries"><span>' + (i > 0 ? '← <a href="#' + sibs[i - 1].id + '">' + esc(sibs[i - 1].name) + '</a>' : '') + '</span><a href="#' + sec[0] + '">All ' + esc(sec[1].toLowerCase()) + '</a><span>' + (i < sibs.length - 1 ? '<a href="#' + sibs[i + 1].id + '">' + esc(sibs[i + 1].name) + '</a> →' : '') + '</span></nav>';
    return h;
  }

  function viewSearch(term) {
    var t = term.toLowerCase(), res = [];
    ENT.forEach(function (e) {
      var s = 0, n = e.name.toLowerCase();
      if (n.indexOf(t) === 0) s += 6; else if (n.indexOf(t) >= 0) s += 4;
      if (e.sum.toLowerCase().indexOf(t) >= 0) s += 2;
      if (e.body.join(' ').toLowerCase().indexOf(t) >= 0) s += 1;
      if (e.office && e.office.toLowerCase().indexOf(t) >= 0) s += 2;
      if (s) res.push([s, e]);
    });
    res.sort(function (a, b) { return b[0] - a[0] || byY(a[1], b[1]); });
    return '<div class="eyebrow">Search</div><h1>' + res.length + ' result' + (res.length === 1 ? '' : 's') + ' for “' + esc(term) + '”</h1>' +
      (res.length ? '<div class="cards" style="margin-top:20px">' + res.slice(0, 60).map(function (r) { return card(r[1]); }).join('') + '</div>' : '<p class="empty">No entries match. Try a place, a person or a doctrine.</p>');
  }

  /* ------------------------------------------------------------ routing */
  function current() { return decodeURIComponent((location.hash || '').replace(/^#/, '')); }
  function render() {
    var h = current(), html, active = '';
    var term = q.value.trim();
    if (term.length > 1) { html = viewSearch(term); }
    else if (!h) { html = viewHome(); }
    else if (h === 'timeline') { html = viewTimeline(); active = h; }
    else if (h === 'about') { html = viewAbout(); active = h; }
    else {
      var sec = SEC.filter(function (s) { return s[0] === h; })[0];
      if (sec) { active = h; html = h === 'faiths' ? viewFaiths() : h === 'leaders' ? viewLeaders() : viewList(sec); }
      else if (ID[h]) { var e = ID[h]; active = SEC.filter(function (s) { return s[2] === e.t; })[0][0]; html = viewEntity(e); document.title = e.name + ' | Alternate Reformation Compendium'; }
      else { html = '<h1>Entry not found</h1><p class="empty">There is no entry called “' + esc(h) + '”. <a href="#">Return to the start</a>.</p>'; }
    }
    if (!ID[h]) document.title = 'Alternate Reformation Compendium';
    main.innerHTML = html;
    drawNav(active);
  }
  function drawNav(active) {
    nav.innerHTML = '<a href="#"' + (active === '' && !current() ? ' aria-current="page"' : '') + '>Overview</a><a href="#timeline"' + (active === 'timeline' ? ' aria-current="page"' : '') + '>Timeline</a><hr>' +
      SEC.map(function (s) { return '<a href="#' + s[0] + '"' + (active === s[0] ? ' aria-current="page"' : '') + '>' + s[1] + '<span class="n">' + ofType(s[2]).length + '</span></a>'; }).join('') +
      '<hr><a href="atlas.html#1550">Map (atlas)</a><a href="#about"' + (active === 'about' ? ' aria-current="page"' : '') + '>Open threads</a>';
  }

  window.addEventListener('hashchange', function () { q.value = ''; render(); window.scrollTo(0, 0); document.getElementById('rail').classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); });
  q.addEventListener('input', render);
  main.addEventListener('click', function (ev) {
    var b = ev.target.closest('button.chip'); if (!b) return;
    if (b.dataset.st) filter.status = b.dataset.st;
    if (b.dataset.role) filter.role = b.dataset.role;
    if (b.dataset.ty) filter.type = b.dataset.ty;
    render();
  });
  document.getElementById('menuBtn').addEventListener('click', function () {
    var r = document.getElementById('rail'), o = r.classList.toggle('open'); this.setAttribute('aria-expanded', o ? 'true' : 'false');
  });
  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('arc-theme', next); } catch (e) {}
  });
  try { var t = localStorage.getItem('arc-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  render();
})();
</script>
